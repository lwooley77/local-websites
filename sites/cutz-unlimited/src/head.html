<style>
%%FONTS%%
:root{
  --paper:#f2ede3;--paper-2:#e8e1d3;--paper-3:#d9cfbc;
  --ink:#191816;--ink-2:#45413a;--ink-3:#625c51;
  --red:#a3271f;--red-d:#86201a;--steel:#2f4a5c;
  --night:#161a1e;--night-2:#20262c;--cream:#f2ede3;--cream-2:#c9c2b4;
  --ease:cubic-bezier(.23,1,.32,1);--ease2:cubic-bezier(.77,0,.175,1);
  --disp:'Anton',Impact,'Arial Narrow',sans-serif;
  --mono:'Plex Mono',ui-monospace,Consolas,monospace;
  --body:'Karla',Arial,sans-serif;
  --g:16px;--max:1180px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--g)}
.mono{font-family:var(--mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.nw{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.press{transition:transform .16s var(--ease),background-color .2s var(--ease),color .2s var(--ease)}
.press:active{transform:scale(.97)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:999px;font-weight:700;font-size:17px;text-decoration:none;border:2px solid var(--ink);cursor:pointer;background:transparent}
.btn svg{width:20px;height:20px;flex:none}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-red:hover{background:var(--red-d);border-color:var(--red-d)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-line:hover{background:var(--ink);color:var(--paper)}

/* preview bar */
.pbar{background:var(--ink);color:var(--cream);font-size:13px;display:flex;align-items:center;gap:8px;padding:0 4px 0 var(--g);min-height:40px}
.pbar p{margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar p b{color:#fff}
.pbar button{background:none;border:0;width:44px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--cream)}
.pbar.gone{display:none}

/* nav */
.nav{position:sticky;top:0;z-index:40;background:rgba(242,237,227,.96);border-bottom:1px solid var(--paper-3);transition:transform .28s var(--ease)}
.nav.hide{transform:translateY(-100%)}
.nav .wrap{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--disp);font-size:24px;letter-spacing:.02em;line-height:1;white-space:nowrap;text-transform:uppercase}
.logo svg{width:16px;height:36px;flex:none}
.nav ul{display:none;list-style:none;margin:0 0 0 auto;padding:0;gap:4px}
.nav ul a{display:block;padding:10px 12px;text-decoration:none;font-weight:500;font-size:16px;border-radius:8px}
.nav ul a:hover{background:var(--paper-2)}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;margin-left:auto}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.badge.open i{background:#2f7a3b;box-shadow:0 0 0 3px rgba(47,122,59,.18)}
.badge.open{color:#235c2c}
.nav .call{display:none;min-height:44px;padding:0 18px;font-size:16px}
.menu-btn{width:48px;height:48px;border:0;background:none;display:grid;place-items:center;cursor:pointer;margin-right:-8px}
.menu-btn svg{width:26px;height:26px}
@media(min-width:960px){
  .nav ul{display:flex}.badge{margin-left:8px}.nav .call{display:inline-flex}.menu-btn{display:none}
}

/* phone menu */
.menu{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--cream);display:flex;flex-direction:column;padding:12px var(--g) 28px;opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .24s var(--ease),transform .24s var(--ease),visibility 0s .24s}
.menu.on{opacity:1;visibility:visible;transform:none;transition:opacity .24s var(--ease),transform .24s var(--ease)}
.menu-top{display:flex;align-items:center;justify-content:space-between;height:52px}
.menu-top .logo{color:var(--cream)}
.menu-close{width:48px;height:48px;border:0;background:none;color:var(--cream);display:grid;place-items:center;cursor:pointer;margin-right:-8px}
.menu ol{list-style:none;margin:28px 0 0;padding:0;counter-reset:m}
.menu li a{display:flex;align-items:baseline;gap:14px;padding:12px 0;text-decoration:none;font-family:var(--disp);font-size:44px;line-height:1.05;border-bottom:1px solid #2c3238}
.menu li a span{font-family:var(--mono);font-size:13px;color:var(--cream-2);width:26px}
.menu .btn{margin-top:auto;width:100%}
.menu .menu-addr{color:var(--cream-2);font-size:15px;margin:14px 0 0;text-align:left}

/* hero */
.hero{position:relative;padding:34px 0 40px;overflow:hidden}
.hero .wrap{display:grid;gap:30px}
.kicker{display:flex;align-items:center;gap:12px;color:var(--ink-2);margin:0 0 14px}
.kicker::before{content:"";width:28px;height:2px;background:var(--red);flex:none}
.hero h1{font-family:var(--disp);font-weight:400;line-height:.86;letter-spacing:.005em;margin:0;font-size:min(21.5vw,150px);text-transform:uppercase}
.hero h1 span{display:block}
.hero h1 .u{color:var(--red)}
.lede{font-size:19px;line-height:1.55;color:var(--ink-2);max-width:34ch;margin:20px 0 26px}
.lede strong{color:var(--ink);font-weight:700}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.cta .btn{flex:1 1 220px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:22px;color:var(--ink-2)}
.hero-meta a{text-decoration:none;border-bottom:2px solid var(--paper-3);padding:8px 0}
.hero-meta a:hover{border-color:var(--red)}
.art{position:relative;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:stretch;max-width:330px}
.fadecard{position:relative;background:var(--paper-2);border:1px solid var(--paper-3);border-radius:22px;padding:18px 18px 16px;overflow:hidden}
.fadecard svg{width:100%;height:auto;display:block}
.fadecard figcaption{display:flex;justify-content:space-between;gap:10px;color:var(--ink-3);margin-top:10px;font-size:12px}
.pole{width:52px;border-radius:999px;background:var(--ink);padding:8px;display:flex;flex-direction:column;gap:8px}
.pole .cap{height:22px;border-radius:999px 999px 6px 6px;background:#c9c2b4}
.pole .cap.b{border-radius:6px 6px 999px 999px}
.pole .glass{flex:1;border-radius:999px;overflow:hidden;position:relative;background:var(--paper);min-height:200px}
.pole .glass svg{position:absolute;left:0;top:-200px;width:100%;height:calc(100% + 400px)}
.photo{position:absolute;inset:0;border-radius:22px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
@media(min-width:900px){
  .hero{padding:64px 0 72px}
  .hero .wrap{grid-template-columns:1.25fr .9fr;align-items:center;gap:56px}
  .lede{font-size:20px}
  .art{justify-self:end;width:100%;max-width:520px;gap:18px}
}

/* strip */
.strip{background:var(--night);color:var(--cream);overflow:hidden;border-block:4px solid var(--red)}
.strip-track{display:flex;width:max-content;animation:strip 46s linear infinite}
.strip:hover .strip-track{animation-play-state:paused}
.strip ul{display:flex;list-style:none;margin:0;padding:0}
.strip a{display:flex;align-items:center;gap:18px;padding:0 18px;min-height:60px;text-decoration:none;font-family:var(--disp);font-size:26px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.strip a:hover{color:#fff}
.strip a svg{width:22px;height:22px;color:var(--red);flex:none}
@keyframes strip{to{transform:translateX(-50%)}}

/* sections */
section{position:relative}
.sec{padding:72px 0}
.sec-head{display:grid;gap:10px;margin-bottom:30px}
.sec-head .num{color:var(--red)}
h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(44px,11vw,84px);line-height:.95;letter-spacing:.01em;margin:0}
.sec-head p{margin:6px 0 0;color:var(--ink-2);max-width:52ch}
.comb{display:block;width:100%;height:14px;color:var(--ink);opacity:.9}

/* services */
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--g)*-1) 22px;padding:2px var(--g) 4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:9px;min-height:48px;padding:0 18px;border-radius:999px;border:2px solid var(--ink);background:transparent;cursor:pointer;font-weight:700;font-size:16px}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.panel{display:none}
.panel.on{display:block;animation:pin .26s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(6px)}}
.panel.flash .rows{box-shadow:0 0 0 3px var(--red)}
.rows{list-style:none;margin:0;padding:0;border-radius:18px;background:#fbf8f2;border:1px solid var(--paper-3);overflow:hidden;transition:box-shadow .3s var(--ease)}
.rows li+li{border-top:1px dashed var(--paper-3)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 16px;align-items:center;padding:18px 18px;text-decoration:none;min-height:76px}
.row:hover{background:var(--paper)}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--paper-2);display:grid;place-items:center;grid-row:span 2}
.row .ic svg{width:24px;height:24px}
.row b{font-size:18px;font-weight:700;line-height:1.3}
.row small{grid-column:2;font-size:15px;color:var(--ink-2);line-height:1.45}
.row .pr{grid-row:1/span 2;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:2px}
.row .pr span{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.row .pr em{font-style:normal;font-weight:700;font-size:15px;color:var(--red);display:flex;align-items:center;gap:6px;white-space:nowrap}
.row .pr em svg{width:16px;height:16px}
.svc-note{display:flex;gap:14px;align-items:flex-start;margin-top:18px;color:var(--ink-2);font-size:16px}
.svc-note svg{width:22px;height:22px;flex:none;margin-top:3px;color:var(--red)}
.steam{position:absolute;right:18px;top:-6px;width:60px;height:60px;pointer-events:none;color:var(--ink-3);opacity:0}
.panel.on .steam path{animation:steam 2.4s var(--ease) 1 forwards}
.panel.on .steam path:nth-child(2){animation-delay:.25s}
.panel.on .steam path:nth-child(3){animation-delay:.5s}
.steam path{opacity:0}
@keyframes steam{0%{opacity:0;transform:translateY(14px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-16px)}}
@media(min-width:900px){
  .svc-grid{display:grid;grid-template-columns:280px 1fr;gap:48px;align-items:start}
  .tabs{flex-direction:column;margin:0;padding:0;overflow:visible;position:sticky;top:96px}
  .tab{justify-content:flex-start;border-radius:14px;min-height:56px}
  .row{padding:20px 26px}
}

/* about */
.about{background:var(--paper-2);border-block:1px solid var(--paper-3)}
.about-grid{display:grid;gap:36px}
.about p{margin:0 0 16px;font-size:18px;color:var(--ink-2);max-width:56ch}
.about p strong{color:var(--ink)}
.chairs{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.chairs li{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--paper-3);align-items:baseline}
.chairs .mono{color:var(--red)}
.chairs b{font-family:var(--disp);font-weight:400;font-size:32px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.chairs span{display:block;color:var(--ink-2);font-size:16px;margin-top:6px}
.chairs-note{color:var(--ink-3);font-size:14px;margin-top:12px}
.razor{width:100%;max-width:440px;height:auto;color:var(--ink);margin:6px 0 22px}
.about .photo-slot{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/5;margin-bottom:22px}
.about .photo-slot img{width:100%;height:100%;object-fit:cover}
@media(min-width:900px){.about-grid{grid-template-columns:1.2fr 1fr;gap:72px;align-items:start}}

/* reviews */
.rating{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px;text-decoration:none;margin-bottom:34px}
.rating .big{font-family:var(--disp);font-size:120px;line-height:.8}
.stars{display:flex;gap:4px;color:var(--red)}
.stars svg{width:24px;height:24px}
.rating .cnt{display:block;color:var(--ink-2);margin-top:8px;font-size:16px}
.rating .cnt u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--red)}
.quotes{display:grid;gap:16px;list-style:none;margin:0;padding:0}
.q{background:#fbf8f2;border:1px solid var(--paper-3);border-radius:20px;padding:24px 22px;margin:0;position:relative}
.q blockquote{margin:0;font-size:18px;line-height:1.55}
.q figcaption{margin-top:16px;display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:15px}
.q figcaption b{color:var(--ink)}
.q .mark{font-family:var(--disp);font-size:72px;line-height:.6;color:var(--red);display:block;height:30px}
.q.lead{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.q.lead blockquote{font-size:22px}
.q.lead figcaption{color:var(--cream-2)}.q.lead figcaption b{color:#fff}
.src-note{color:var(--ink-3);font-size:14px;margin-top:16px}
.src-note a{color:var(--ink-2)}
@media(min-width:900px){
  .quotes{grid-template-columns:repeat(6,1fr)}
  .quotes>li:first-child{grid-column:1/span 4;grid-row:1/span 2}.q.lead{padding:40px}.q{height:100%}
  .q.lead blockquote{font-size:30px;line-height:1.35}
  .quotes>li:nth-child(2){grid-column:5/span 2;grid-row:1}
  .quotes>li:nth-child(3){grid-column:5/span 2;grid-row:2}
  .quotes>li:nth-child(4){grid-column:2/span 5}
}

/* contact */
.contact{background:var(--night);color:var(--cream)}
.contact h2{color:var(--cream)}
.contact .sec-head p{color:var(--cream-2)}
.cards{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.card{display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:20px;text-decoration:none;background:var(--night-2);border:1px solid #303841;min-height:140px}
.card:hover{border-color:var(--cream-2)}
.card svg{width:30px;height:30px;color:var(--red)}
.card .mono{color:var(--cream-2);font-size:12px}
.card b{font-family:var(--disp);font-weight:400;font-size:28px;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:#fff}
.card span{color:var(--cream-2);font-size:15px}
.card.big{grid-column:1/-1;background:var(--red);border-color:var(--red);min-height:170px}
.card.big svg,.card.big .mono,.card.big span{color:#fff}
.card.big b{font-size:clamp(40px,11vw,64px)}
.card.big:hover{background:var(--red-d)}
.card b .nw{font-size:inherit;color:inherit}
.book-note{color:var(--cream-2);margin-top:20px;font-size:16px;max-width:60ch}
@media(min-width:900px){.cards{grid-template-columns:2fr 1fr 1fr}.card.big{grid-column:auto}}

/* faq */
.faq-list{border-top:2px solid var(--ink);max-width:860px}
.faq-item{border-bottom:1px solid var(--paper-3)}
.faq-item h3{margin:0}
.faq-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;background:none;border:0;padding:20px 0;min-height:64px;text-align:left;cursor:pointer;font-weight:700;font-size:19px;line-height:1.35}
.faq-btn svg{width:22px;height:22px;flex:none;transition:transform .24s var(--ease)}
.faq-btn[aria-expanded="true"] svg{transform:rotate(45deg)}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--ease)}
.faq-a>div{overflow:hidden}
.faq-a p{margin:0 0 20px;color:var(--ink-2);max-width:62ch}
.faq-a a{color:var(--red);font-weight:700}
.faq-item.open .faq-a{grid-template-rows:1fr}

/* hours */
.hours{background:var(--paper-2);border-top:1px solid var(--paper-3)}
.hours-grid{display:grid;gap:30px}
.htable{width:100%;border-collapse:collapse;font-size:18px}
.htable th,.htable td{padding:14px 12px;text-align:left;border-bottom:1px solid var(--paper-3)}
.htable th{font-weight:500}
.htable td{text-align:right;font-family:var(--mono);font-size:15px;font-weight:500}
.htable tr.today{background:var(--ink);color:var(--paper)}
.htable tr.today th{font-weight:700}
.htable tr.today th::after{content:"Today";font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-left:10px;color:#e9b3ae}
.hours-note{font-size:15px;color:var(--ink-2);margin-top:14px}
.loc{background:#fbf8f2;border:1px solid var(--paper-3);border-radius:20px;overflow:hidden}
.loc svg.map{width:100%;height:auto;display:block;background:var(--paper)}
.loc-body{padding:22px}
.loc-body address{font-style:normal;font-size:20px;font-weight:700;line-height:1.4;margin-bottom:16px}
.loc-body .btn{width:100%}
@media(min-width:900px){.hours-grid{grid-template-columns:1fr 1fr;gap:56px;align-items:start}}

/* footer */
footer{background:var(--night);color:var(--cream-2);padding-bottom:96px}
.scene{display:block;width:100%;height:auto}
.foot{display:grid;gap:22px;padding-top:28px}
.foot .logo{color:var(--cream);font-size:34px}
.foot p{margin:0;font-size:15px}
.foot a{color:var(--cream);text-underline-offset:3px}
.foot-links{display:flex;flex-wrap:wrap;gap:4px 18px}
.foot-links a{display:inline-block;padding:10px 0}
.small{font-size:13px;color:#a39d91}
.sign-lit{opacity:0;transition:opacity .6s var(--ease)}
.is-open .sign-lit{opacity:1}
.is-open .sign-off{opacity:0}
