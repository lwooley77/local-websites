<style>
%%FONTS%%
:root{
  --bg:#EEF1E7; --surf:#E2E8D8; --surf2:#D3DCC6;
  --ink:#14231B; --ink2:#34473B; --ink3:#4D6053;
  --sign:#0F5A3A; --sign-d:#0B3F29; --sign-dd:#082F1F;
  --white:#F7F8F2; --mist:#CFDCD2;
  --hay:#E7B748; --hay-l:#F5D688; --hay-dk:#7A5410; --line:#F2C94C;
  --asphalt:#3E4641;
  --fd:'Bricolage Grotesque', Georgia, serif;
  --fl:'Bebas Neue', 'Arial Narrow', sans-serif;
  --fb:'Work Sans', 'Helvetica Neue', Arial, sans-serif;
  --e:cubic-bezier(.23,1,.32,1); --e2:cubic-bezier(.77,0,.175,1);
  --wrap:1160px; --gut:20px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--fb);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fd);font-weight:700;line-height:1.02;letter-spacing:-.02em;margin:0}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nw{white-space:nowrap}
:focus-visible{outline:3px solid var(--hay);outline-offset:3px;border-radius:6px}
.press{transition:transform .16s var(--e)}
.press:active{transform:scale(.97)}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
img[data-k]{display:none}
img[data-k].has{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:14px}

/* labels */
.lab{font:400 17px/1 var(--fl);letter-spacing:.16em;text-transform:uppercase;color:var(--hay-dk);display:flex;align-items:center;gap:12px}
.lab .dash{display:inline-flex;gap:5px}
.lab .dash i{display:block;width:14px;height:3px;background:var(--line);border-radius:2px}
.lab .dash i:nth-child(2){opacity:.6}
.mm{display:inline-grid;place-items:center;width:30px;height:40px;flex:none;background:var(--sign);color:var(--white);border-radius:5px;box-shadow:inset 0 0 0 2.5px var(--sign),inset 0 0 0 4px var(--white);font:400 20px/1 var(--fl);letter-spacing:0;padding-top:2px}
.sec-head{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
.sec-head h2{font-size:clamp(38px,8.6vw,64px)}
.sec-head p{color:var(--ink2);max-width:36em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:12px;font:600 17px/1 var(--fb);text-decoration:none;border:2px solid transparent;cursor:pointer;background:none}
.btn-sign{background:var(--sign);color:var(--white);box-shadow:inset 0 0 0 3px var(--sign),inset 0 0 0 4.5px rgba(247,248,242,.85)}
.btn-sign:hover{background:var(--sign-d);box-shadow:inset 0 0 0 3px var(--sign-d),inset 0 0 0 4.5px rgba(247,248,242,.85)}
.btn-line{border-color:var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--bg)}
.btn-hay{background:var(--hay);color:var(--sign-dd)}
.btn-hay:hover{background:#F0C55C}

/* preview bar */
#pbar{background:var(--sign-dd);color:var(--mist);font:500 14px/1.3 var(--fb);position:relative;z-index:60}
#pbar .wrap{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding-right:56px}
#pbar b{color:var(--hay);font-weight:600;white-space:nowrap}
#pbar .long{display:none}
#pbar-x{position:absolute;right:6px;top:0;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;color:var(--white);cursor:pointer}
#pbar.gone{display:none}

/* nav */
#nav{position:sticky;top:0;z-index:50;background:rgba(238,241,231,.96);border-bottom:1px solid var(--surf2);transition:transform .26s var(--e)}
#nav.hide{transform:translateY(-100%)}
#nav .wrap{display:flex;align-items:center;gap:14px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.blade{display:inline-flex;align-items:center;justify-content:center;background:var(--sign);color:var(--white);border-radius:5px;box-shadow:inset 0 0 0 2.5px var(--sign),inset 0 0 0 4px var(--white);font:400 22px/1 var(--fl);letter-spacing:.06em;padding:9px 11px 7px;white-space:nowrap}
.brand .sub{font:600 13px/1.15 var(--fb);color:var(--ink2);letter-spacing:.01em}
.brand .sub span{display:block;font-weight:500;color:var(--ink3)}
.links{display:none;gap:4px;margin-left:auto}
.links a{text-decoration:none;font-weight:500;font-size:16px;padding:10px 12px;border-radius:8px;color:var(--ink2)}
.links a:hover{background:var(--surf);color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:8px;font:500 13.5px/1.2 var(--fb);color:var(--ink2);white-space:nowrap}
.badge i{width:9px;height:9px;border-radius:50%;background:#A1ADA4;flex:none}
.badge.open i{background:#1F8A55;box-shadow:0 0 0 4px rgba(31,138,85,.16)}
#nav .badge{margin-left:auto}
.nav-call{display:none}
#menu-btn{width:48px;height:48px;display:grid;place-items:center;background:none;border:0;border-radius:10px;cursor:pointer;color:var(--ink);flex:none}
#menu-btn .ico{width:26px;height:26px}

/* menu */
#menu{position:fixed;inset:0;z-index:80;background:var(--sign-d);color:var(--white);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .22s var(--e),visibility 0s linear .22s}
#menu.on{opacity:1;visibility:visible;transition:opacity .22s var(--e)}
#menu .top{display:flex;align-items:center;justify-content:space-between;padding:12px var(--gut);min-height:68px}
#menu .blade{box-shadow:inset 0 0 0 2.5px var(--sign),inset 0 0 0 4px var(--white)}
#menu-x{width:48px;height:48px;display:grid;place-items:center;background:none;border:2px solid rgba(247,248,242,.3);border-radius:10px;color:var(--white);cursor:pointer}
#menu nav{display:flex;flex-direction:column;padding:12px var(--gut);gap:2px}
#menu nav a{font:700 34px/1.1 var(--fd);letter-spacing:-.02em;text-decoration:none;padding:12px 0;border-bottom:1px solid rgba(247,248,242,.14);display:flex;align-items:center;gap:14px}
#menu nav a small{font:400 16px/1 var(--fl);letter-spacing:.14em;color:var(--hay);min-width:22px}
#menu .foot{margin-top:auto;padding:20px var(--gut) calc(24px + env(safe-area-inset-bottom));display:grid;gap:10px}
#menu .foot .badge{color:var(--mist)}

/* hero */
.hero{padding:34px 0 46px;position:relative}
.hero .grid{display:grid;gap:34px}
.hero h1{font-size:clamp(52px,14.2vw,112px);line-height:.93;letter-spacing:-.035em;margin:18px 0 20px;color:var(--ink)}
.hero h1 .l2{display:block;color:var(--sign)}
.hero .lede{font-size:18px;color:var(--ink2);max-width:30em}
.hero .lede b{color:var(--ink);font-weight:600}
.hero .ctas{display:grid;gap:12px;margin:26px 0 22px}
.rate{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink2);font-size:16px;min-height:44px}
.rate .stars{display:flex;gap:2px;color:var(--hay-dk)}
.rate .stars svg{width:17px;height:17px;fill:currentColor}
.rate b{color:var(--ink);font-weight:600}
.rate u{text-decoration-color:var(--surf2);text-underline-offset:4px}
.art{position:relative;border-radius:22px;overflow:hidden;background:#DCE5D6;aspect-ratio:480/520;width:100%;max-width:520px;margin:0 auto}
.art svg{width:100%;height:100%}
.art .cap{position:absolute;left:14px;bottom:12px;font:400 14px/1 var(--fl);letter-spacing:.16em;color:var(--white);background:rgba(11,63,41,.82);padding:7px 9px 5px;border-radius:5px}
#hawk{transform:translate(-120px,0);opacity:0}
.fly #hawk{animation:fly 14s linear forwards}
@keyframes fly{0%{transform:translate(-120px,40px);opacity:1}100%{transform:translate(620px,-30px);opacity:1}}
#shingle{transform-origin:205px 282px;transform-box:view-box}
.sway #shingle{animation:sway 2.6s var(--e) 1}
@keyframes sway{0%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-2.5deg)}70%{transform:rotate(1deg)}100%{transform:rotate(0)}}

/* strip */
.strip{background:var(--sign);color:var(--white);border-block:5px solid var(--sign-d);overflow:hidden;position:relative}
.strip .track{display:flex;width:max-content;animation:roll 46s linear infinite}
.strip:hover .track{animation-play-state:paused}
.strip ul{display:flex;list-style:none;margin:0;padding:0}
.strip li{display:flex;align-items:center}
.strip a{display:flex;align-items:center;min-height:62px;padding:0 20px;font:400 24px/1 var(--fl);letter-spacing:.1em;text-decoration:none;white-space:nowrap;padding-top:3px}
.strip a:hover{color:var(--hay)}
.strip li::after{content:"";width:26px;height:4px;background:var(--line);border-radius:2px;flex:none}
@keyframes roll{to{transform:translateX(-50%)}}

/* sections */
section{padding:72px 0}
.alt{background:var(--surf)}

/* services */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 2px;margin:0 -2px 18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:10px;border:2px solid var(--surf2);background:var(--bg);font:600 16px/1 var(--fb);color:var(--ink2);cursor:pointer;transition:background .18s var(--e),color .18s var(--e),border-color .18s var(--e)}
.tab .ico{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sign{position:relative;background:var(--sign);color:var(--white);border-radius:16px;padding:8px;box-shadow:0 1px 0 var(--sign-d),0 18px 40px -24px rgba(11,63,41,.6)}
.sign-in{border:2.5px solid var(--white);border-radius:11px;padding:20px 18px 8px}
.sign-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:2px solid rgba(247,248,242,.9)}
.sign-top h3{font:400 30px/1 var(--fl);letter-spacing:.08em;padding-top:3px}
.sign-top .ico{width:40px;height:40px;stroke-width:1.5;color:var(--hay)}
.rows{list-style:none;margin:0;padding:0}
.rows li+li{border-top:1px solid rgba(247,248,242,.22)}
.row{display:flex;align-items:center;gap:14px;padding:16px 4px;text-decoration:none;min-height:70px;border-radius:8px;transition:background .18s var(--e)}
.row:hover{background:rgba(247,248,242,.07)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font:600 19px/1.25 var(--fb)}
.row .t span{display:block;font-size:15px;color:var(--mist);margin-top:3px;line-height:1.4}
.row .p{flex:none;display:flex;align-items:center;gap:8px;font:400 17px/1 var(--fl);letter-spacing:.1em;color:var(--hay-l);text-align:right;padding-top:2px}
.row .p svg{width:28px;height:28px;stroke-width:2.2}
.row .p em{font-style:normal}
.row .t .cp{display:none;font:400 16px/1 var(--fl);font-style:normal;letter-spacing:.1em;color:var(--hay-l);margin-top:9px;padding-top:2px}
.rows.flash{animation:flash .9s var(--e)}
@keyframes flash{0%{background:rgba(231,183,72,.28)}100%{background:transparent}}
.svc-note{margin-top:18px;color:var(--ink2);font-size:16px;display:flex;gap:10px;align-items:flex-start}
.svc-note .ico{color:var(--sign);margin-top:2px}

/* about */
.about .grid{display:grid;gap:36px;align-items:center}
.about h2{font-size:clamp(40px,9vw,66px)}
.about .copy p{color:var(--ink2);margin-top:16px;max-width:34em}
.about .copy p:first-of-type{margin-top:22px;color:var(--ink);font-size:19px}
.ledger{list-style:none;margin:26px 0 0;padding:0;border-top:2px solid var(--ink)}
.ledger li{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--surf2);font-size:16px}
.ledger li span:first-child{font:400 17px/1.3 var(--fl);letter-spacing:.12em;color:var(--ink3);padding-top:2px}
.ledger li span:last-child{font-weight:600;text-align:right}
.chairs{background:var(--bg);border-radius:22px;padding:18px;border:1px solid var(--surf2)}
.chairs svg{width:100%;height:auto}

/* reviews */
.revs{background:var(--sign-d);color:var(--white);position:relative;overflow:hidden}
.revs .lab{color:var(--hay)}
.revs .sec-head p{color:var(--mist)}
.score{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px;margin:4px 0 30px}
.score .big{font:700 112px/.8 var(--fd);letter-spacing:-.05em;color:var(--white)}
.score .stars{display:flex;gap:4px;color:var(--hay);margin-bottom:6px}
.score .stars svg{width:24px;height:24px;fill:currentColor}
.score .of{color:var(--mist);font-size:16px}
.score a{color:var(--white);font-weight:600;text-underline-offset:4px}
.carousel{position:relative}
.cards{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 8px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 86%;scroll-snap-align:start;background:var(--sign);border-radius:16px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:20px;box-shadow:inset 0 0 0 1px rgba(247,248,242,.12)}
.card q{quotes:none;font:700 23px/1.22 var(--fd);letter-spacing:-.015em;color:var(--white)}
.card .who{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mist)}
.card .who b{color:var(--white);font-weight:600}
.card .who i{width:22px;height:3px;background:var(--line);border-radius:2px}
.car-ctl{display:flex;align-items:center;gap:10px;margin-top:18px}
.car-ctl button{width:50px;height:50px;border-radius:12px;border:2px solid rgba(247,248,242,.35);background:none;color:var(--white);display:grid;place-items:center;cursor:pointer}
.car-ctl button:hover{border-color:var(--white)}
.car-ctl .count{font:400 18px/1 var(--fl);letter-spacing:.14em;color:var(--mist);margin-left:6px;padding-top:2px}
.src{font-size:14px;color:var(--mist);margin-top:18px}

/* contact */
.contact .grid{display:grid;gap:12px}
.cc{display:flex;align-items:center;gap:16px;padding:22px 20px;border-radius:16px;text-decoration:none;min-height:88px;border:2px solid var(--surf2);background:var(--bg)}
.cc:hover{border-color:var(--ink)}
.cc .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--surf);flex:none;color:var(--sign)}
.cc .ic .ico{width:26px;height:26px}
.cc b{display:block;font:700 24px/1.1 var(--fd);letter-spacing:-.01em}
.cc .w{display:block;min-width:0}
.cc .tx{display:block;color:var(--ink2);font-size:15.5px;margin-top:4px}
.cc.call{background:var(--sign);border-color:var(--sign);color:var(--white);box-shadow:inset 0 0 0 4px var(--sign),inset 0 0 0 5.5px rgba(247,248,242,.8)}
.cc.call .ic{background:var(--hay);color:var(--sign-dd)}
.cc.call .tx{color:var(--mist)}
.cc.call b{font-size:30px}
.fbline{margin-top:16px;font-size:15.5px;color:var(--ink2)}
.fbline a{font-weight:600;text-underline-offset:4px}

/* faq */
.faq{max-width:820px}
.qa{border-bottom:1px solid var(--surf2)}
.qa:first-child{border-top:2px solid var(--ink)}
.qa h3{margin:0;font:inherit}
.qa button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;background:none;border:0;padding:20px 2px;min-height:64px;cursor:pointer;font:600 18.5px/1.35 var(--fb);color:var(--ink)}
.qa button .pm{width:30px;height:30px;flex:none;border-radius:8px;background:var(--surf);display:grid;place-items:center;transition:transform .22s var(--e),background .22s var(--e)}
.qa button[aria-expanded="true"] .pm{transform:rotate(45deg);background:var(--hay)}
.qa .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--e)}
.qa button[aria-expanded="true"]+.ans{grid-template-rows:1fr}
.qa .ans>div{overflow:hidden}
.qa .ans p{padding:0 2px 22px;color:var(--ink2);max-width:40em}
.qa .ans a{color:var(--sign);font-weight:600}

/* hours */
.hl .grid{display:grid;gap:18px}
.hcard{background:var(--bg);border-radius:18px;border:1px solid var(--surf2);padding:22px 20px}
.hcard h3{font:400 24px/1 var(--fl);letter-spacing:.1em;display:flex;align-items:center;gap:10px;padding-top:2px}
.hcard h3 .ico{color:var(--sign)}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:17px}
td{padding:12px 10px;border-bottom:1px solid var(--surf2)}
td:last-child{text-align:right;font-weight:500}
tr.closed td:last-child{color:var(--ink3);font-weight:400}
tr.today td{background:var(--sign);color:var(--white);font-weight:600;border-bottom-color:var(--sign)}
tr.today td:first-child{border-radius:8px 0 0 8px}
tr.today td:last-child{border-radius:0 8px 8px 0;color:var(--white)}
tr.today td:first-child::after{content:"Today";font:400 14px/1 var(--fl);letter-spacing:.14em;color:var(--hay-l);margin-left:10px}
.hnote{font-size:15px;color:var(--ink2);margin-top:14px}
.map{position:relative;border-radius:14px;overflow:hidden;background:#D9E2CF;margin-top:14px}
.map svg{width:100%;height:auto}
.addr{font:700 26px/1.15 var(--fd);letter-spacing:-.01em;margin-top:12px}
.addr span{display:block;font:400 17px/1.4 var(--fb);color:var(--ink2);margin-top:4px;letter-spacing:0}
.hl .btn{margin-top:16px;width:100%}

/* footer */
footer{background:var(--sign-dd);color:var(--mist);position:relative;overflow:hidden}
.scene{position:relative;height:250px;background:#1C3A2A}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
#truck{transform:translateX(-340px)}
.seen #truck{animation:drive 9s linear 1 forwards .6s}
@keyframes drive{from{transform:translateX(-340px)}to{transform:translateX(1500px)}}
#hawk2{opacity:0}
