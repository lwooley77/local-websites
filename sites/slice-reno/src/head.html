<style>
%%FONTS%%
:root{

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}

.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:6px}

.lbl{font:600 13px/1.2 var(--label);letter-spacing:.14em;text-transform:uppercase}

/* preview bar */
.pv{background:var(--ink);color:var(--on-night)}

/* nav */
.nav{position:sticky;top:0;z-index:40;background:rgba(245,239,232,.94);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line);transition:transform .28s var(--ease)}
