<style>
%%FONTS%%
:root{--ink:#0d1311;--ink2:#141e1a;--ink3:#1b2822;--ivory:#f5efe2;--paper:#fbf7ee;--emerald:#0e5a45;--emerald-d:#0a4535;--em-l:#1f7a5f;--gold:#d6b25e;--gold-d:#7a5c17;--mute:#b9c2b8;--ink-mute:#4a554f;

*{box-sizing:border-box;margin:0;padding:0}
