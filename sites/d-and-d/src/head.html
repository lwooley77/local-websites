<style>
%%FONTS%%
:root{
  --bg:#13221c; --bg2:#1b2f27; --bg3:#22392f; --line:#2d463b;
  --text:#f2ead9; --muted:#c9c0ab; --muted2:#a3ad9f;
  --sun:#f2913d; --sun2:#f7a75f;
  --card:#efe3c8; --card2:#e6d7b6; --ink:#1d1a14; --stamp:#b8321f; --ink2:#6b604c;
  --ease:cubic-bezier(.23,1,.32,1); --ease2:cubic-bezier(.77,0,.175,1);
  --disp:'Archivo Black', 'Libre Franklin', sans-serif;
  --lab:'Oswald', 'Libre Franklin', sans-serif;
  --body:'Libre Franklin', sans-serif;
  --wrap:1180px; --gut:20px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.6 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:400}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
.nw{white-space:nowrap}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lab{font:500 14px/1.2 var(--lab);letter-spacing:.16em;text-transform:uppercase}
.press{transition:transform 160ms var(--ease),background-color 200ms var(--ease),color 200ms var(--ease),border-color 200ms var(--ease)}
.press:active{transform:scale(.97)}

/* preview bar */
.pbar{background:var(--card);color:var(--ink);font-size:14px;line-height:1.3}
.pbar .wrap{display:flex;align-items:center;gap:12px;min-height:42px}
.pbar p{flex:1;min-width:0;white-space:nowrap}
.pbar b{font-weight:600}
.pbar .pl{display:none}
@media (min-width:600px){.pbar .pl{display:inline}.pbar .ps{display:none}}
.pbar button{width:44px;height:42px;display:grid;place-items:center;margin-right:-12px}
.pbar.gone{display:none}

/* nav */
.nav{position:sticky;top:0;z-index:40;background:rgba(19,34,28,.94);border-bottom:1px solid var(--line);transition:transform 260ms var(--ease)}
@supports (backdrop-filter:blur(8px)){.nav{backdrop-filter:blur(8px)}}
.nav.hide{transform:translateY(-100%)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo svg{width:34px;height:34px}
.logo b{font:400 21px/1 var(--disp);letter-spacing:.01em}
.logo b i{font-style:normal;color:var(--sun)}
.nav-links{display:none;gap:26px;margin-left:auto}
.nav-links a{text-decoration:none;font:500 15px/1 var(--lab);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 0}
.nav-links a:hover{color:var(--text)}
.badge{display:flex;align-items:center;gap:8px;margin-left:auto;font:500 14px/1 var(--lab);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted2);flex:none}
.badge.open{color:var(--text)}
.badge.open::before{background:var(--sun);box-shadow:0 0 0 4px rgba(242,145,61,.22)}
.nav .nav-call{display:none}
.burger{width:46px;height:46px;display:grid;place-items:center;margin-right:-8px;border-radius:10px}
.burger span{display:block;width:24px;height:2px;background:var(--text);box-shadow:0 7px 0 var(--text),0 -7px 0 var(--text)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:12px;font:600 17px/1 var(--body);text-decoration:none;border:2px solid transparent}
.btn-sun{background:var(--sun);color:var(--bg)}
.btn-sun:hover{background:var(--sun2)}
.btn-line{border-color:var(--muted2);color:var(--text)}
.btn-line:hover{border-color:var(--text)}

/* menu */
.menu{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:16px var(--gut) calc(24px + env(safe-area-inset-bottom));opacity:0;transform:translateY(-12px);transition:opacity 220ms var(--ease),transform 260ms var(--ease)}
.menu.on{opacity:1;transform:none}
.menu-top{display:flex;align-items:center;justify-content:space-between;height:52px}
.menu-x{width:48px;height:48px;display:grid;place-items:center;margin-right:-8px}
.menu ol{margin-top:28px;counter-reset:m}
.menu ol a{display:flex;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;font:400 32px/1.1 var(--disp)}
.menu ol a::before{counter-increment:m;content:"0" counter(m);font:500 14px/1 var(--lab);letter-spacing:.14em;color:var(--sun)}
.menu-foot{margin-top:auto;display:grid;gap:12px}
.menu-foot p{color:var(--muted);font-size:15px}

/* hero */
.hero{position:relative;padding:34px 0 40px;overflow:hidden}
.hero .wrap{display:grid;gap:30px}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--sun)}
.eyebrow::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--sun);flex:none}
.h1{margin-top:16px;font:400 clamp(96px,30vw,190px)/.86 var(--disp);letter-spacing:-.02em;word-spacing:-.14em;color:var(--text)}
.h1 .amp{color:var(--sun)}
.h1 small{display:block;margin-top:14px;font:600 clamp(26px,8.6vw,46px)/1 var(--lab);letter-spacing:.42em;text-transform:uppercase;color:var(--text);margin-right:-.42em}
.lede{margin-top:22px;font-size:18px;line-height:1.6;color:var(--muted);max-width:34em}
.lede b{color:var(--text);font-weight:600}
.cta{display:grid;gap:12px;margin-top:26px}
.cta .btn{width:100%}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px;color:var(--muted2);font:500 15px/1.3 var(--lab);letter-spacing:.1em;text-transform:uppercase}
.facts li{display:flex;align-items:center;gap:8px}
.facts li::before{content:"";width:6px;height:6px;background:var(--sun);border-radius:50%}
.facts a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}

.clockbox{position:relative;width:100%;max-width:470px;justify-self:center;padding:22px 0 0}
.tcard-back{position:absolute;right:-6%;top:0;width:58%;aspect-ratio:3/4.4;background:var(--card);border-radius:6px;transform:rotate(7deg);box-shadow:0 18px 40px rgba(0,0,0,.35);padding:18px 16px;color:var(--ink)}
.tcard-back .lab{font-size:11px;color:var(--ink2);letter-spacing:.18em}
.tcard-back strong{display:block;margin-top:6px;font:400 17px/1 var(--disp)}
.tcard-back .rows{margin-top:14px;display:grid;gap:9px}
.tcard-back .rows span{display:block;height:1px;background:rgba(29,26,20,.18)}
.tcard-back .punch{position:absolute;left:50%;top:10px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--bg)}
.clock{position:relative;width:86%;max-width:400px}
.clock svg{width:100%;height:auto;filter:drop-shadow(0 22px 34px rgba(0,0,0,.45))}
.clock-cap{margin-top:14px;display:flex;align-items:center;gap:10px;color:var(--muted);font:500 14px/1.35 var(--lab);letter-spacing:.12em;text-transform:uppercase}
.clock-cap i{width:22px;height:8px;border-radius:4px;background:var(--sun);flex:none}
#hand-h,#hand-m{transition:transform 600ms var(--ease)}
.photo{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.photo img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}

/* strip */
.strip{background:var(--sun);color:var(--bg);overflow:hidden;border-block:1px solid #c8722a}
.strip-track{display:flex;width:max-content;animation:marq 38s linear infinite}
.strip:hover .strip-track{animation-play-state:paused}
.strip ul{display:flex;flex:none}
.strip a{display:flex;align-items:center;gap:12px;padding:0 26px;height:62px;text-decoration:none;font:600 20px/1 var(--lab);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.strip a .ico{width:24px;height:24px;stroke-width:1.9}
.strip a:hover{text-decoration:underline;text-underline-offset:5px}
@keyframes marq{to{transform:translateX(-50%)}}

/* sections */
.sec{padding:72px 0}
.sec-h{display:grid;gap:12px;margin-bottom:34px}
.sec-h .lab{color:var(--sun);display:flex;align-items:center;gap:12px}
.sec-h .lab::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--sun);flex:none}
.h2{font:400 clamp(38px,10.5vw,66px)/.98 var(--disp);letter-spacing:-.01em}
.sec-h p{color:var(--muted);max-width:36em}
.perf{height:14px;background:radial-gradient(circle at 7px 7px,var(--bg) 3.5px,transparent 4px) 0 0/22px 14px repeat-x}

/* services */
.svc{background:var(--bg2)}
.menu-grid{display:grid;gap:22px}
.cat{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:24px 20px 10px;scroll-margin-top:96px;transition:box-shadow 300ms var(--ease),border-color 300ms var(--ease)}
.cat.flash{border-color:var(--sun);box-shadow:0 0 0 3px rgba(242,145,61,.35)}
.cat-h{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:2px solid var(--text)}
.cat-h .ico{width:40px;height:40px;stroke:var(--sun);stroke-width:1.4}
.cat-h h3{font:400 26px/1.05 var(--disp)}
.cat-h p{font:500 13px/1.2 var(--lab);letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-top:5px}
.rows a{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;min-height:64px;padding:14px 0;border-bottom:1px dashed var(--line);text-decoration:none}
.rows li:last-child a{border-bottom:0}
.rows b{font-weight:600;font-size:18px;line-height:1.3}
.rows small{grid-column:1;color:var(--muted2);font-size:15px;line-height:1.4}
.rows em{grid-row:1 / span 2;grid-column:2;font:500 14px/1 var(--lab);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);display:flex;align-items:center;gap:8px;padding:10px 0}
@media (hover:hover){.rows a:hover b{color:var(--sun2)}}
.rows a:active{transform:scale(.99)}
.price-note{margin-top:22px;display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-radius:14px;background:var(--card);color:var(--ink)}
.price-note .ico{stroke:var(--stamp);width:26px;height:26px;margin-top:2px}
.price-note p{font-size:16px;line-height:1.5}
.price-note a{font-weight:600;color:var(--stamp)}

/* about */
.about .wrap{display:grid;gap:36px}
.about-copy > p{color:var(--muted);margin-top:16px;max-width:34em}
.about-copy > p.lead{margin-top:0;font-size:20px;line-height:1.55;color:var(--text)}
.amp-art{position:relative;display:grid;place-items:center;min-height:300px;border-radius:18px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.amp-art svg.big{width:78%;max-width:330px;height:auto}
.amp-art .note{position:absolute;left:18px;bottom:16px;right:18px;display:flex;justify-content:space-between;gap:10px;color:var(--muted2);font:500 13px/1.2 var(--lab);letter-spacing:.14em;text-transform:uppercase}
.ticks{display:grid;gap:0;margin-top:26px;border-top:1px solid var(--line)}
.ticks li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-weight:500}
.ticks .ico{stroke:var(--sun)}

/* reviews */
.rev{background:var(--bg2)}
.rev-grid{display:grid;gap:18px}
.score{display:flex;flex-direction:column;justify-content:space-between;gap:22px;padding:26px 22px;border-radius:18px;background:var(--sun);color:var(--bg);text-decoration:none}
.score .num{font:400 96px/.9 var(--disp);letter-spacing:-.03em}
.stars{display:flex;gap:4px}
.stars svg{width:24px;height:24px;fill:var(--bg)}
.score p{font:600 18px/1.35 var(--body)}
.score span.lk{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--lab);letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid var(--bg);padding-bottom:4px;align-self:flex-start}
.quotes{display:grid;gap:18px}
.q{margin:0;padding:24px 22px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}
.q blockquote{margin:0;font:400 20px/1.5 var(--body);color:var(--text)}
.q.lg blockquote{font:400 clamp(24px,6.4vw,34px)/1.25 var(--disp);letter-spacing:-.005em}
.q figcaption{margin-top:16px;color:var(--muted2);font:500 14px/1.2 var(--lab);letter-spacing:.14em;text-transform:uppercase}
.q figcaption a{color:var(--muted);text-underline-offset:4px}

/* contact */
.ct-grid{display:grid;gap:14px}
.ct{display:flex;align-items:center;gap:18px;padding:22px 20px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);text-decoration:none;min-height:96px}
.ct .ico{width:30px;height:30px;stroke:var(--sun)}
.ct b{display:block;font:400 22px/1.1 var(--disp)}
.ct div > span{display:block;margin-top:5px;color:var(--muted);font-size:16px}
.ct.big{background:var(--sun);border-color:var(--sun);color:var(--bg)}
.ct.big .ico{stroke:var(--bg);width:36px;height:36px}
.ct.big b{font-size:clamp(28px,8vw,40px)}
.ct.big div > span{color:var(--bg);font-weight:500}
.ct:hover{border-color:var(--muted2)}

/* faq */
.faq-list{border-top:2px solid var(--text);max-width:860px}
.faq-item{border-bottom:1px solid var(--line)}
.faq-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;padding:20px 0;min-height:64px;font:600 19px/1.35 var(--body)}
.faq-btn .pm{position:relative;width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--sun)}
.faq-btn .pm::before,.faq-btn .pm::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;margin:-1px 0 0 -6px;background:var(--sun);transition:transform 240ms var(--ease)}
.faq-btn .pm::after{transform:rotate(90deg)}
.faq-item.open .pm::after{transform:rotate(0)}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows 260ms var(--ease)}
.faq-item.open .faq-a{grid-template-rows:1fr}
.faq-a > div{overflow:hidden}
.faq-a p{padding:0 0 22px;color:var(--muted);max-width:40em}
.faq-a a{color:var(--sun);font-weight:600}

/* hours */
.hrs{background:var(--bg2)}
.hrs-grid{display:grid;gap:26px}
.timecard{position:relative;background:var(--card);color:var(--ink);border-radius:8px;padding:28px 18px 22px;box-shadow:0 20px 44px rgba(0,0,0,.35)}
.timecard::before{content:"";position:absolute;left:50%;top:12px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--bg2)}
.tc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:10px 0 12px;border-bottom:2px solid var(--ink)}
.tc-head strong{font:400 22px/1 var(--disp)}
.tc-head span{font:500 12px/1.3 var(--lab);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);text-align:right}
.tc{width:100%;border-collapse:collapse;margin-top:6px;font:500 17px/1 var(--lab);letter-spacing:.06em;text-transform:uppercase}
.tc th{font:500 12px/1 var(--lab);letter-spacing:.18em;color:var(--ink2);text-align:left;padding:12px 6px 8px}
.tc td{padding:13px 6px;border-bottom:1px solid rgba(29,26,20,.16)}
.tc td:first-child{font-weight:600;width:34%}
.tc tr.off td{color:var(--ink2)}
.tc tr.today td{color:var(--stamp)}
.tc tr.today td:first-child{position:relative}
.tc .stamp{display:none;margin-left:8px;padding:3px 6px 2px;border:2px solid var(--stamp);border-radius:4px;font-size:11px;letter-spacing:.14em;vertical-align:2px}
.tc tr.today .stamp{display:inline-block}
.tc tr.today.pressed .stamp{animation:stamp 280ms var(--ease) both}
@keyframes stamp{from{opacity:0;transform:scale(1.35) rotate(-6deg)}to{opacity:1;transform:rotate(-4deg)}}
.tc-foot{margin-top:14px;font:500 12px/1.4 var(--lab);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.today-line{margin-top:18px;color:var(--text);font-weight:500}
.loc{display:grid;gap:18px;align-content:start}
.loc address{font-style:normal;font:400 clamp(30px,8.6vw,44px)/1.05 var(--disp)}
.loc address span{display:block;margin-top:8px;font:500 18px/1.3 var(--lab);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.loc .ticks{margin-top:0}
.loc .btn{width:100%}

/* footer */
.foot{position:relative;background:var(--bg);overflow:hidden}
.scene{position:relative;height:300px;overflow:hidden}
.scene svg{position:absolute;left:50%;bottom:0;width:1440px;max-width:none;height:300px;transform:translateX(-50%)}
#sun{transition:none}
.foot .win{fill:#2a3b33;transition:fill 300ms var(--ease)}
.foot .opencard{opacity:.25;transition:opacity 300ms var(--ease)}
.foot.is-open .win{fill:#f7c27d}
.foot.is-open .opencard{opacity:1}
.foot-body{background:#0e1914;padding:40px 0 calc(110px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.foot-body .wrap{display:grid;gap:26px}
.foot-body .foot-name{font:400 34px/1 var(--disp);color:var(--text)}
.foot-name i{font-style:normal;color:var(--sun)}
.foot-body p{color:var(--muted);font-size:15px}
.foot-links{display:flex;flex-wrap:wrap;gap:8px 22px}
.foot-links a{display:inline-flex;align-items:center;min-height:44px;color:var(--text);text-decoration:none;font:500 15px/1 var(--lab);letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.fine{font-size:13px!important;color:var(--muted2)!important;line-height:1.6}

/* bottom bar */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0e1914;border-top:1px solid var(--line)}
.bbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:58px;border-radius:12px;text-decoration:none;font:500 13px/1 var(--lab);letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
.bbar a .ico{width:24px;height:24px}
.bbar a.main{background:var(--sun);color:var(--bg)}

/* sheet */
