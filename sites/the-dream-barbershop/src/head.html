<style>
%%FONTS%%
:root{
  --ink:#12100e;--ink-2:#1b1815;--ink-3:#262019;--line:#3a3128;
  --cream:#f4ecdf;--sand:#d4c8b4;--dust:#a99c86;
  --brass:#e0ad5e;--brass-2:#b9893f;--pole:#c8432f;
  --ease:cubic-bezier(.23,1,.32,1);--ease-2:cubic-bezier(.77,0,.175,1);
  --display:'Young Serif',Georgia,serif;--label:'Josefin Sans',sans-serif;--body:'Karla',sans-serif;
  --pad:20px;--max:1180px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--ink);color:var(--sand);font:400 17px/1.6 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--cream);line-height:1.05;margin:0;letter-spacing:-.01em}
p{margin:0 0 1em}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.label{font:600 12.5px/1.3 var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.press{transition:transform .16s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.press:active{transform:scale(.97)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font:700 16px/1 var(--body);text-decoration:none;border:1.5px solid transparent;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn-gold{background:var(--brass);color:var(--ink)}
.btn-gold:hover{background:#ebbd72}
.btn-line{border-color:var(--brass-2);color:var(--cream)}
.btn-line:hover{border-color:var(--brass);background:rgba(224,173,94,.08)}

/* preview bar */
.pv{background:var(--brass);color:var(--ink);font:600 12px/1 var(--label);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;min-height:38px}
.pv span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:2px}
.pv b{font-weight:inherit}
.pv .s{display:none}
@media (max-width:520px){.pv .l{display:none}.pv .s{display:inline}}
.pv button{background:none;border:0;width:44px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.pv button svg{width:14px;height:14px}

/* nav */
.nav{position:sticky;top:0;z-index:40;background:rgba(18,16,14,.94);border-bottom:1px solid var(--line);transition:transform .28s var(--ease)}
.nav.hide{transform:translateY(-100%)}
.nav .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--cream);font:400 21px/1 var(--display);white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.links{display:none;gap:26px;margin-left:auto}
.links a{text-decoration:none;font:600 13px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--sand);padding:12px 0}
.links a:hover{color:var(--brass)}
.badge{display:inline-flex;align-items:center;gap:7px;font:500 13px/1.2 var(--body);color:var(--sand);white-space:nowrap;margin-left:auto}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--dust);flex:none}
.badge em{font-style:normal}
@media (max-width:430px){.badge em{display:none}.badge{font-size:12.5px;gap:6px}.brand{font-size:19px;gap:8px}.brand svg{width:28px;height:28px}.nav .wrap{gap:10px}}
.badge.open i{background:#7bc47f;box-shadow:0 0 0 3px rgba(123,196,127,.18)}
.nav .btn{min-height:44px;padding:0 18px;font-size:15px;display:none}
.mbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex:none}
.mbtn svg{width:20px;height:20px}

/* phone menu */
.menu{position:fixed;inset:0;z-index:60;background:var(--ink);display:flex;flex-direction:column;padding:16px var(--pad) 28px;opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .24s var(--ease),transform .24s var(--ease),visibility 0s linear .24s;overflow:auto}
.menu.on{opacity:1;visibility:visible;transform:none;transition:opacity .24s var(--ease),transform .24s var(--ease)}
.menu .top{display:flex;align-items:center;justify-content:space-between;height:48px}
.menu nav{display:flex;flex-direction:column;margin:28px 0 auto}
.menu nav a{font:400 34px/1.1 var(--display);color:var(--cream);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.menu nav a small{font:600 12px/1 var(--label);letter-spacing:.18em;color:var(--dust);white-space:nowrap;margin-left:12px}
.menu .acts{display:grid;gap:12px;margin-top:28px}
.menu .note{margin-top:18px;font-size:15px;color:var(--dust)}

/* hero */
.hero{position:relative;overflow:hidden;padding:34px 0 0}
.hero .sky{position:absolute;inset:0;pointer-events:none;opacity:.7}
.hero .wrap{position:relative;display:grid;gap:10px}
.hero .where{margin-bottom:14px}
.hero h1{font-size:clamp(68px,21vw,150px);line-height:.88;letter-spacing:-.02em}
.hero .shop{display:flex;align-items:center;gap:14px;margin:14px 0 20px;font:600 clamp(15px,4.4vw,22px)/1 var(--label);letter-spacing:.42em;text-transform:uppercase;color:var(--brass)}
.hero .shop::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--brass-2),transparent);max-width:220px}
.hero .lede{font-size:18.5px;color:var(--sand);max-width:30em;text-shadow:0 1px 12px var(--ink)}
.hero .lede b{color:var(--cream);font-weight:500}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 14px}
.cta .btn{flex:1 1 auto}
.see{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:500;color:var(--cream);text-decoration:none;border-bottom:1px solid var(--brass-2);align-self:start;justify-self:start}
.see:hover{color:var(--brass)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:15px;color:var(--dust)}
.facts b{color:var(--sand);font-weight:500}
.art{position:relative;margin:26px auto 0;width:100%;max-width:440px}
.art svg{width:100%;height:auto;display:block}
.art .photo{position:absolute;left:4.55%;top:3.85%;width:72.7%;height:92.3%;object-fit:cover;border-radius:50% 50% 0 0/33.3% 33.3% 0 0}
.tw{animation:tw 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,86%,100%{opacity:1}92%{opacity:.25}}
.stripes{animation:pole 9s linear infinite}
@keyframes pole{to{transform:translateY(-56px)}}

/* strip */
.strip{border-block:1px solid var(--line);background:var(--ink-2);overflow:hidden;margin-top:0}
.strip .track{display:flex;width:max-content;animation:mq 46s linear infinite}
.strip:hover .track{animation-play-state:paused}
.strip ul{display:flex;list-style:none;margin:0;padding:0}
.strip li{display:flex;align-items:center}
.strip a{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 22px;text-decoration:none;font:400 21px/1 var(--display);color:var(--cream);white-space:nowrap}
.strip a:hover{color:var(--brass)}
.strip li::after{content:"";width:7px;height:7px;background:var(--brass-2);transform:rotate(45deg)}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
section{position:relative}
.sec{padding:84px 0}
.head{display:grid;gap:12px;margin-bottom:34px;max-width:40em}
.head h2{font-size:clamp(38px,9.4vw,64px)}
.head p{font-size:17.5px;margin:0}
.phase{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--brass);position:relative;overflow:hidden;vertical-align:-1px;margin-right:10px}
.phase::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ink);transform:translateX(var(--o,40%))}
.alt .phase::after{background:var(--ink-2)}
.alt{background:var(--ink-2)}

/* services */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font:600 13px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--sand);display:flex;align-items:center;gap:8px}
.tab svg{width:18px;height:18px;display:none}
@media (min-width:700px){.tab svg{display:block}}
.tab[aria-selected="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.menu-list{display:block}
.cat{break-inside:avoid;display:block}
.cat[hidden]{display:none}
.cat h3{display:flex;align-items:center;gap:12px;font-size:26px;padding:22px 0 10px;border-bottom:1px solid var(--brass-2)}
.cat h3 svg{width:30px;height:30px;flex:none}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;padding:16px 0;text-decoration:none;border-bottom:1px solid var(--line);transition:background-color .3s var(--ease)}
.row .n{transition:color .2s var(--ease)}
.row:hover .n{color:var(--brass)}
.row .n{color:var(--cream);font-weight:500;font-size:18px;line-height:1.3}
.row .d{grid-column:1;font-size:14.5px;color:var(--dust)}
.row .p{grid-row:1/3;grid-column:2;text-align:right;font:400 26px/1 var(--display);color:var(--brass)}
.row .p small{display:block;font:600 11px/1.4 var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--dust);margin-top:6px}
.row.flash{background:rgba(224,173,94,.14)}
.more{margin-top:28px;display:grid;gap:14px;padding:22px;border:1px dashed var(--brass-2);border-radius:16px;transition:box-shadow .3s var(--ease)}
.more.flash{box-shadow:0 0 0 2px var(--brass)}
.more p{margin:0;color:var(--sand)}
.more p b{color:var(--cream);font-weight:500}
.more .btn{justify-self:start}

/* about */
.about .wrap{display:grid;gap:44px}
.about .copy p{font-size:18px}
.about .copy p b{color:var(--cream);font-weight:500}
.board{position:relative;border-radius:14px;padding:12px;background:#3a2a1a;box-shadow:inset 0 0 0 1px #5a432b,0 24px 50px -24px #000}
.board .felt{border-radius:6px;padding:26px 22px 24px;background:repeating-linear-gradient(180deg,#191512 0 7px,#100d0b 7px 9px)}
.board h3{font:600 14px/1 var(--label);letter-spacing:.32em;text-transform:uppercase;color:var(--brass);text-align:left;margin-bottom:18px}
.board ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.board li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font:600 clamp(22px,6vw,30px)/1.5 var(--label);letter-spacing:.16em;text-transform:uppercase;color:#efe6d6;text-shadow:0 1px 0 #000}
.board li small{font:600 11px/1 var(--label);letter-spacing:.2em;color:var(--ink);background:var(--brass);padding:6px 8px 4px;border-radius:3px;text-shadow:none}
.board .foot{margin-top:18px;font:600 12px/1.4 var(--label);letter-spacing:.2em;color:var(--dust);text-transform:uppercase}
.board .photo{border-radius:6px;margin-bottom:12px;aspect-ratio:4/3;object-fit:cover;width:100%}

/* reviews */
.rev{overflow:hidden}
.rev .wrap{display:grid;gap:28px}
.score{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px 22px}
.score .big{font:400 clamp(110px,30vw,190px)/.8 var(--display);color:var(--cream);grid-row:1/3}
.stars{display:flex;gap:4px}
.stars svg{width:26px;height:26px}
.score .of{font-size:16px;color:var(--sand)}
.score .of b{color:var(--cream);font-weight:500}
.rlinks{display:grid;gap:12px}
.rcard{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;text-decoration:none;background:var(--ink-3);min-height:64px}
.rcard:hover{border-color:var(--brass-2)}
.rcard .t{color:var(--cream);font-weight:500}
.rcard .s{font-size:14.5px;color:var(--dust)}
.rcard svg{width:20px;height:20px;flex:none;color:var(--brass)}
.shoot{position:absolute;top:60px;left:-160px;width:150px;height:2px;background:linear-gradient(90deg,transparent,var(--cream));border-radius:2px;opacity:0;transform:rotate(-14deg);pointer-events:none}
.shoot.go{animation:sh 1.3s var(--ease) 1 forwards}
@keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(-14deg)}15%{opacity:.9}100%{opacity:0;transform:translate(115vw,-28vw) rotate(-14deg)}}
.rev .moonbig{position:absolute;right:-18px;bottom:-26px;width:100px;opacity:.16;pointer-events:none}

/* contact */
.cards{display:grid;gap:12px}
.card{display:grid;gap:6px;align-content:start;padding:22px;border-radius:18px;background:var(--ink-3);border:1px solid var(--line);text-decoration:none;min-height:120px;position:relative;overflow:hidden}
.card:hover{border-color:var(--brass-2)}
.card .k{display:flex;align-items:center;gap:10px}
.card .k svg{width:22px;height:22px;color:var(--brass)}
.card .v{font:400 26px/1.15 var(--display);color:var(--cream)}
.card .h{font-size:15px;color:var(--dust)}
.card.call{background:var(--brass);border-color:var(--brass)}
.card.call .label,.card.call .k svg{color:var(--ink)}
.card.call .v{color:var(--ink);font-size:clamp(32px,9vw,46px)}
.card.call .h{color:#3b2c17}
.card.book{border-style:dashed;border-color:var(--brass-2)}
.card .deco{display:none;position:absolute;right:-30px;top:-30px;width:240px;height:240px;color:var(--ink);opacity:.16;pointer-events:none}

/* faq */
.faq{display:grid;max-width:820px}
.q{border-bottom:1px solid var(--line)}
.q button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:18px;text-align:left;background:none;border:0;padding:20px 0;min-height:64px;cursor:pointer;font:500 18.5px/1.35 var(--body);color:var(--cream)}
.q button svg{width:20px;height:20px;flex:none;color:var(--brass);transition:transform .25s var(--ease)}
.q button[aria-expanded="true"] svg{transform:rotate(45deg)}
.q .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--ease)}
.q .a>div{overflow:hidden}
.q .a p{padding:0 0 20px;margin:0;max-width:40em}
.q.open .a{grid-template-rows:1fr}

/* hours */
.hl .wrap{display:grid;gap:36px}
.days{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.days li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:17.5px}
.days li span:first-child{color:var(--cream);font-weight:500}
.days li.closed span:last-child{color:var(--dust)}
.days li.today{background:var(--cream);border-color:transparent;border-radius:10px;padding:14px;margin:-1px -14px 0}
.days li.today span{color:var(--ink)!important}
.days li.today span:first-child::after{content:"  Today";font:600 11px/1 var(--label);letter-spacing:.18em;text-transform:uppercase;margin-left:10px;color:#6b4f22}
.hnote{font-size:14.5px;color:var(--dust);margin-top:12px}
.place{border-radius:18px;background:var(--ink-3);border:1px solid var(--line);overflow:hidden}
.place svg.map{display:block;width:100%;height:auto;background:#17130f}
.place .in{padding:22px;display:grid;gap:14px}
.place address{font-style:normal;font:400 26px/1.2 var(--display);color:var(--cream)}
.place address span{display:block;font:400 17px/1.5 var(--body);color:var(--sand);margin-top:6px}
.place .row2{display:flex;flex-wrap:wrap;gap:10px}
.place .row2 .btn{flex:1 1 auto}

/* footer */
footer{position:relative;background:#0c0a09;padding-bottom:96px}
.scene{display:block;width:100%;height:auto;min-height:230px}
.fin{background:#0c0a09;padding:34px 0 10px}
.fin .wrap{display:grid;gap:22px}
.fin .nm{font:400 30px/1 var(--display);color:var(--cream)}
.fin p{margin:0;font-size:15.5px}
.fin a{color:var(--sand)}
.fin .soc{display:flex;flex-wrap:wrap;gap:4px 18px}
.fin .soc a{min-height:44px;display:inline-flex;align-items:center;text-decoration-color:var(--brass-2);text-underline-offset:4px}
.fin .small{font-size:13.5px;color:var(--dust);border-top:1px solid var(--line);padding-top:16px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(12,10,9,.97);border-top:1px solid var(--line)}
.bar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;border-radius:12px;text-decoration:none;font:600 11.5px/1 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--sand)}
.bar a svg{width:21px;height:21px;color:var(--brass)}
.bar a.b{background:var(--brass);color:var(--ink)}
.bar a.b svg{color:var(--ink)}

img[data-k]{display:none}
img[data-k].on{display:block}

@media (min-width:700px){
  :root{--pad:32px}
  .cta .btn{flex:0 0 auto}
  .cards{grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto auto}
  .card.call{grid-row:1/3;min-height:260px;align-content:end}
  .card .deco{display:block}
  .rev .moonbig{right:40px;bottom:-40px;width:170px}
  .card.book{grid-column:1/3}
  .rlinks{grid-template-columns:1fr 1fr}
  .menu-list{columns:2;column-gap:56px}
}
@media (min-width:980px){
  body{font-size:18px}
  .links{display:flex}
  .badge{margin-left:18px}
  .nav .btn{display:inline-flex}
  .mbtn{display:none}
  .bar{display:none}
  footer{padding-bottom:0}
  .hero{padding:56px 0 64px}
  .hero .wrap{grid-template-columns:1.1fr .9fr;align-items:center;gap:40px}
  .art{margin:0;max-width:470px;justify-self:end}
  .about .wrap{grid-template-columns:1.1fr .9fr;align-items:center;gap:72px}
  .rev .wrap{grid-template-columns:1fr 1fr;align-items:center;gap:64px}
  .rlinks{grid-template-columns:1fr}
  .hl .wrap{grid-template-columns:1fr 1fr;gap:64px;align-items:start}
  .sec{padding:110px 0}
  .fin .wrap{grid-template-columns:1.2fr 1fr 1fr;align-items:start}
  .fin .small{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .strip .track{width:auto}
