<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Belle Nails | Nail Salon on Sharlands Ave, Reno NV</title>
<meta name="description" content="La Belle Nails in Northwest Reno: manicures, gel nails, pedicures and nail art at 6275 Sharlands Ave. Call or text %%PHONE%% to book.">
<meta name="theme-color" content="#1f2b25">
<meta property="og:title" content="La Belle Nails | Nail Salon in Reno, NV">
<meta property="og:description" content="Manicures, gel nails, pedicures and nail art on Sharlands Ave in Northwest Reno. Call %%PHONE%%.">
<meta property="og:type" content="website">

"address":{"@type":"PostalAddress","streetAddress":"6275 Sharlands Ave #8","addressLocality":"Reno","addressRegion":"NV","postalCode":"89523","addressCountry":"US"},
"hasMap":"%%MAPS%%","sameAs":["%%IG%%"],
"aggregateRating":{"@type":"AggregateRating","ratingValue":"%%RATING%%","reviewCount":"%%REVIEWS%%"}}
</script>
<style>
%%FONTS%%
:root{
  --ink:#1f2b25;--ink-2:#2c3c33;--paper:#f7f3ea;--paper-2:#efe8da;--sage:#c9d6c3;--sage-2:#dfe7da;--sage-d:#3f5a4b;
  --peach:#e9b9a1;--clay:#a8523a;--clay-d:#8a412c;--gold:#b79a5b;--muted:#55605a;--line:#ddd5c4;
  --e1:cubic-bezier(.23,1,.32,1);--e2:cubic-bezier(.77,0,.175,1);
  --disp:'Young Serif',Georgia,serif;--lab:'Josefin Sans',Arial,sans-serif;--body:'Karla',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:17px/1.6 var(--body);overflow-x:hidden}
a{color:inherit}
svg{display:block}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--clay);outline-offset:3px;border-radius:6px}
.dark :focus-visible,footer :focus-visible,.bar :focus-visible,#menu :focus-visible,#pbar :focus-visible{outline-color:var(--peach)}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.lab{font:600 13px/1.2 var(--lab);letter-spacing:.18em;text-transform:uppercase}
h2{font:400 clamp(36px,5.6vw,56px)/1.05 var(--disp);letter-spacing:-.01em}
.sec{padding:88px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:4px 24px 0;border-radius:6px;font:600 15px/1 var(--lab);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:2px solid transparent;transition:transform .16s var(--e1),background-color .2s var(--e1),color .2s var(--e1)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex:none;fill:currentColor;margin-top:-4px}
.b-main{background:var(--ink);color:var(--paper)}
.b-main:hover{background:var(--sage-d)}
.b-line{border-color:var(--ink);color:var(--ink)}
.b-line:hover{background:var(--ink);color:var(--paper)}
.b-clay{background:var(--clay);color:#fff}
.b-clay:hover{background:var(--clay-d)}

/* preview bar */
#pbar{background:var(--ink);color:var(--paper);font:600 12px/1 var(--lab);letter-spacing:.12em;text-transform:uppercase}
#pbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding-top:2px}
#pbar span{white-space:nowrap}
#pbar b{color:var(--peach);font-weight:600}
#pbar button{background:none;border:0;color:var(--paper);width:44px;height:40px;display:grid;place-items:center;cursor:pointer;margin-right:-12px}
#pbar button svg{width:16px;height:16px;stroke:currentColor}
#pbar.gone{display:none}
.pv-s{display:none}
@media(max-width:560px){.pv-l{display:none}.pv-s{display:inline}}

/* nav */
.nav{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;min-height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.logo svg{width:34px;height:34px}
.logo b{font:400 23px/1 var(--disp);letter-spacing:-.01em}
.logo small{display:block;font:600 10px/1 var(--lab);letter-spacing:.22em;text-transform:uppercase;color:var(--sage-d);margin-top:5px}
.links{display:flex;gap:24px}
.links a{font:600 13px/1 var(--lab);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:16px 0 12px;border-bottom:2px solid transparent;transition:border-color .2s var(--e1)}
.links a:hover{border-color:var(--clay)}
.nav .btn{min-height:44px;padding:4px 18px 0;font-size:13px}
.mbtn{display:none;background:none;border:0;width:48px;height:48px;place-items:center;cursor:pointer;color:var(--ink);margin-right:-8px}
.mbtn svg{width:26px;height:26px;stroke:currentColor}
@media(max-width:900px){.links,.nav .btn{display:none}.mbtn{display:grid}}

#menu{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;padding:16px 20px 28px;opacity:0;visibility:hidden;transition:opacity .22s var(--e1),visibility 0s .22s}
#menu.open{opacity:1;visibility:visible;transition:opacity .22s var(--e1)}
#menu .top{display:flex;justify-content:space-between;align-items:center;min-height:52px}
#menu .top b{font:400 24px/1 var(--disp)}
#menu button{background:none;border:0;color:var(--paper);width:48px;height:48px;display:grid;place-items:center;cursor:pointer;margin-right:-8px}
#menu button svg{width:24px;height:24px;stroke:currentColor}
#menu nav{display:flex;flex-direction:column;margin-top:24px}
#menu nav a{font:400 34px/1.15 var(--disp);text-decoration:none;padding:12px 0;border-bottom:1px solid rgba(247,243,234,.14)}
#menu .mcta{margin-top:auto;display:grid;gap:10px}
#menu .mcta .btn{width:100%}
#menu .b-line{border-color:var(--paper);color:var(--paper)}

/* awning */
.awn{position:relative;filter:drop-shadow(0 5px 4px rgba(31,43,37,.13))}
.awn i{display:block;height:26px;border-top:4px solid var(--ink);background:repeating-linear-gradient(90deg,var(--sage) 0 24px,#fffdf8 24px 48px)}
.awn b{display:block;height:12px;background:radial-gradient(circle at 12px 0,var(--sage) 12px,transparent 12.6px) 0 0/48px 12px repeat-x,radial-gradient(circle at 36px 0,#fffdf8 12px,transparent 12.6px) 0 0/48px 12px repeat-x}

/* hero */
.hero{padding:34px 0 72px;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero .lab{color:var(--sage-d);display:flex;align-items:center;gap:12px}
.hero .lab::before{content:"";width:28px;height:2px;background:var(--clay)}
.hero h1{font:400 clamp(58px,9.6vw,112px)/.94 var(--disp);letter-spacing:-.025em;margin:20px 0 22px}
.hero h1 span{display:block;color:var(--clay)}
.hero p.lead{font-size:19px;max-width:30ch;color:var(--ink-2)}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .loc{margin-top:22px;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px}
.hero .loc svg{width:16px;height:16px;fill:var(--clay);flex:none}
.art{position:relative;max-width:440px;justify-self:center;width:100%}
.art svg{width:100%;height:auto}
.glint{animation:glint 1.6s var(--e2) .5s 1 both}
@keyframes glint{from{transform:translateX(-260px)}to{transform:translateX(420px)}}
@media(max-width:820px){
  .hero{padding:22px 0 56px}
  .hero .wrap{grid-template-columns:1fr;gap:30px}
  .art{max-width:330px}
  .hero .cta .btn{flex:1 1 100%}
}

/* services strip */
.strip{background:var(--ink);color:var(--paper);padding:20px 0}
.strip ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 0}
.strip li{font:600 14px/1 var(--lab);letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;padding:6px 0 3px}
.strip li+li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--peach);margin:0 22px 3px}
@media(max-width:560px){.strip li{font-size:11.5px;letter-spacing:.1em}.strip li+li::before{width:5px;height:5px;margin:0 9px 3px}}

/* scallop edges */
.scal{height:14px;background:radial-gradient(circle at 12px 0,var(--c,var(--ink)) 11px,transparent 11.6px) 0 0/24px 14px repeat-x}

/* services menu card */
#services{background:var(--paper)}
.svc{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
.svc .lab{color:var(--sage-d)}
.svc h2{margin:14px 0 18px}
.svc .intro p{color:var(--muted);max-width:34ch}
.card{background:#fffdf8;border:1px solid var(--line);border-radius:200px 200px 10px 10px;padding:70px 36px 34px;position:relative;box-shadow:0 18px 40px -26px rgba(31,43,37,.35)}
.card::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:190px 190px 6px 6px;pointer-events:none}
.card h3{text-align:center;font:600 13px/1 var(--lab);letter-spacing:.3em;text-transform:uppercase;color:var(--clay);margin-bottom:22px}
.card h3 i{display:block;width:60px;height:1px;background:var(--gold);margin:12px auto 0}
.row{display:flex;align-items:baseline;gap:12px;padding:16px 4px;min-height:60px;text-decoration:none;border-bottom:1px dashed var(--line);position:relative;transition:background-color .2s var(--e1)}
.row:last-of-type{border-bottom:0}
.row:hover{background:var(--sage-2)}
.row:active{transform:scale(.99)}
.row b{font:400 23px/1.2 var(--disp)}
.row small{display:block;font-size:15px;color:var(--muted);margin-top:3px;font-weight:400}
.row .dots{flex:1;border-bottom:2px dotted var(--sage);transform:translateY(-6px);min-width:16px}
.row em{font:600 12px/1.2 var(--lab);letter-spacing:.12em;text-transform:uppercase;font-style:normal;color:var(--sage-d);white-space:nowrap;padding-top:3px}
.card .note{text-align:center;font-size:15px;color:var(--muted);margin-top:22px}
.card .note a{color:var(--clay-d);font-weight:700;white-space:nowrap}
@media(max-width:820px){
  .svc{grid-template-columns:1fr;gap:32px}
  .card{padding:58px 18px 26px;border-radius:160px 160px 10px 10px}
  .card::before{border-radius:150px 150px 6px 6px}
  .row{flex-wrap:wrap}
  .row .dots{display:none}
  .row div{flex:1 1 100%}
}

/* about */
#about{background:var(--sage-2)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.about .lab{color:var(--sage-d)}
.about h2{margin:14px 0 20px}
.about p{max-width:46ch;margin-bottom:14px;color:var(--ink-2)}
.about .swap{display:inline-flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 16px;font-size:15px;margin:8px 0 22px}
.about .swap svg{width:18px;height:18px;fill:var(--clay);flex:none}
.photo{border-radius:200px 200px 8px 8px;overflow:hidden}
.ill{max-width:420px;width:100%;justify-self:center}
@media(max-width:820px){.about{grid-template-columns:1fr;gap:28px}.ill{max-width:300px;order:-1}}

/* reviews */
.dark{background:var(--ink);color:var(--paper)}
#reviews .wrap{display:grid;grid-template-columns:auto 1fr;gap:64px;align-items:center}
.score{font:400 clamp(110px,16vw,170px)/.8 var(--disp);color:var(--peach);letter-spacing:-.04em}
#reviews .lab{color:var(--sage)}
#reviews h2{margin:14px 0 14px}
#bigStars{display:flex;gap:4px;margin:6px 0 16px}
#reviews p{color:#dfe5dc;max-width:46ch;margin-bottom:24px}
#reviews .b-line{border-color:var(--paper);color:var(--paper)}
#reviews .b-line:hover{background:var(--paper);color:var(--ink)}
@media(max-width:820px){#reviews .wrap{grid-template-columns:1fr;gap:18px}}

/* contact */
#contact .lab{color:var(--sage-d)}
#contact h2{margin:14px 0 34px}
.cgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.cgrid .side{display:grid;gap:16px}
.cc{display:flex;flex-direction:column;justify-content:space-between;gap:18px;border-radius:10px;padding:26px;text-decoration:none;min-height:150px;transition:transform .16s var(--e1),background-color .2s var(--e1)}
.cc:active{transform:scale(.97)}
.cc svg{width:30px;height:30px;fill:currentColor}
.cc b{font:400 clamp(26px,3.6vw,40px)/1.05 var(--disp);display:block}
.cc span{font:600 12.5px/1.3 var(--lab);letter-spacing:.16em;text-transform:uppercase}
.cc.big{background:var(--clay);color:#fff;min-height:316px}
.cc.big:hover{background:var(--clay-d)}
.cc.t{background:var(--ink);color:var(--paper)}
.cc.t:hover{background:var(--ink-2)}
.cc.d{background:var(--sage);color:var(--ink)}
.cc.d:hover{background:#bccbb5}
@media(max-width:820px){.cgrid{grid-template-columns:1fr}.cc.big{min-height:190px}}

/* faq */
#faq{background:var(--paper-2)}
.faq{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px}
.faq .lab{color:var(--sage-d)}
.faq h2{margin-top:14px}
.acc{border-top:1px solid #cfc6b3}
.acc-i{border-bottom:1px solid #cfc6b3}
.acc-b{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;background:none;border:0;padding:20px 2px;min-height:64px;font:400 21px/1.3 var(--disp);color:var(--ink);cursor:pointer}
.acc-b svg{width:22px;height:22px;flex:none;stroke:var(--clay);transition:transform .22s var(--e1)}
.acc-b[aria-expanded="true"] svg{transform:rotate(45deg)}
.acc-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--e1)}
.acc-b[aria-expanded="true"]+.acc-p{grid-template-rows:1fr}
.acc-p>div{overflow:hidden}
.acc-p p{padding:0 2px 22px;color:var(--ink-2);max-width:58ch}
.acc-p a{color:var(--clay-d);font-weight:700;white-space:nowrap}
@media(max-width:820px){.faq{grid-template-columns:1fr;gap:24px}.acc-b{font-size:19px}}

/* hours */
.hl{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.hl .lab{color:var(--sage-d)}
.hl h2{margin:14px 0 26px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px}
.week div{border:1px solid var(--line);border-radius:30px 30px 6px 6px;padding:16px 0 12px;text-align:center;font:600 13px/1 var(--lab);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#fffdf8}
.week div.today{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.week div.today::after{content:"Today";display:block;font-size:9.5px;letter-spacing:.12em;color:var(--peach);margin-top:7px}
.hl .hn{font-size:17px;color:var(--ink-2);margin-bottom:22px}
.hl .hn a{color:var(--clay-d);font-weight:700;white-space:nowrap}
.addr{font:400 30px/1.2 var(--disp);margin:6px 0 4px}
.hl .sub{color:var(--muted);margin-bottom:22px}
.hl .cta{display:flex;flex-wrap:wrap;gap:12px}
@media(max-width:820px){.hl{grid-template-columns:1fr;gap:40px}.week{gap:4px}.week div{font-size:11px;letter-spacing:.04em}}

/* footer */
footer{background:var(--ink);color:#dfe5dc;padding:0 0 120px}
.scene{display:block;width:100%;height:auto;background:var(--paper)}
@media(max-width:820px){.scene{height:130px}}
footer .wrap{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:36px;padding-top:44px}
footer .fl b{font:400 30px/1 var(--disp);color:var(--paper)}
footer p{font-size:15px;margin-top:10px}
footer h4{font:600 12px/1 var(--lab);letter-spacing:.2em;text-transform:uppercase;color:var(--sage);margin-bottom:12px}
footer ul{list-style:none}
footer li a{display:inline-block;padding:8px 0;text-decoration:none;font-size:15px}
footer li a:hover{color:var(--peach)}
#privacy{grid-column:1/-1;border-top:1px solid rgba(247,243,234,.16);padding-top:22px;font-size:14px;color:#cfd8cc}
#privacy b{color:var(--paper)}
footer .copy{grid-column:1/-1;font-size:13.5px;color:#b9c4b6}
@media(max-width:820px){footer .wrap{grid-template-columns:1fr 1fr}footer .fl{grid-column:1/-1}}
@media(min-width:901px){footer{padding-bottom:40px}}

/* phone bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);display:none;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.bar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:56px;color:var(--paper);text-decoration:none;font:600 11px/1 var(--lab);letter-spacing:.12em;text-transform:uppercase;border-radius:6px;transition:transform .16s var(--e1)}
.bar a:active{transform:scale(.97)}
.bar a svg{width:20px;height:20px;fill:currentColor}
.bar a.pri{background:var(--clay)}
@media(max-width:900px){.bar{display:grid}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
