<style>
%%FONTS%%
:root{
  --bg:#F1EFEA;--surf:#E6E4DE;--surf2:#DAD8D1;

}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}

p{margin:0 0 1em}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.lab{font:600 13px/1.2 var(--lab);letter-spacing:.16em;text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--tang);outline-offset:3px;border-radius:6px}
.dark :focus-visible,.dark:focus-visible{outline-color:var(--apricot)}
.press{transition:transform 160ms var(--ease),background-color 200ms var(--ease),color 200ms var(--ease),border-color 200ms var(--ease)}
.press:active{transform:scale(.97)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font:700 16px/1 var(--body);text-decoration:none;border:2px solid transparent;cursor:pointer}

/* preview bar */

.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:0 calc(var(--pad) * -1) 18px;padding-left:var(--pad);padding-right:var(--pad);scrollbar-width:none;position:sticky;top:68px;z-index:5;background:var(--bg)}

/* about */

.rev-grid{display:grid;gap:18px}

/* hours */
.hl-grid{display:grid;gap:28px}
.hours{list-style:none;margin:0;padding:0;border-radius:22px;background:#fff;border:1px solid var(--surf2);overflow:hidden}
.hours li{display:flex;justify-content:space-between;gap:16px;padding:15px 20px;border-top:1px solid var(--surf);font-size:17px}
.hours li:first-child{border-top:0}
.hours li span:first-child{font-weight:700}
.hours li span:last-child{color:var(--ink2);text-align:right}
.hours li.today{background:var(--night);color:var(--on)}
.hours li.today span:last-child{color:var(--on)}
.hours li.today span:first-child::after{content:"Today";margin-left:10px;font:600 11px/1 var(--lab);letter-spacing:.14em;text-transform:uppercase;color:var(--night);background:var(--apricot);padding:4px 7px;border-radius:5px;vertical-align:2px}
.hnote{margin-top:14px;color:var(--ink3);font-size:15px}
.loc{border-radius:22px;background:var(--surf);padding:22px;display:grid;gap:18px}
.loc svg.mapart{width:100%;height:auto;border-radius:14px;background:var(--bg)}
.loc address{font-style:normal;font-size:18px;line-height:1.5}
.loc address b{font-family:var(--disp);font-weight:500;font-size:20px;display:block;margin-bottom:4px}
.loc .btn{width:100%}
@media (min-width:860px){.hl-grid{grid-template-columns:1fr 1fr;gap:48px;align-items:start}}

/* footer */
footer{background:var(--night);color:var(--on2);position:relative}
.scene{display:block;width:100%;height:230px}
@media (min-width:860px){.scene{height:300px}}
.fwrap{padding-top:28px;padding-bottom:120px}
.fgrid{display:grid;gap:26px}
.fname{font:700 30px/1 var(--disp);color:var(--on)}
footer p{margin:6px 0 0;font-size:16px}
footer a{color:var(--on);text-underline-offset:4px}
.flinks{display:flex;flex-wrap:wrap;gap:6px 18px}
.flinks a{display:inline-flex;align-items:center;min-height:44px}
.fine{margin-top:28px;padding-top:18px;border-top:1px solid var(--night3);font-size:14px;color:var(--on3)}
.fine.privacy{margin-top:10px;padding-top:0;border-top:0;max-width:60em}.fine b{color:var(--on2)}
@media (min-width:860px){.fgrid{grid-template-columns:1.3fr 1fr 1fr}.fwrap{padding-bottom:40px}}

/* bottom bar */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--night);border-top:1px solid var(--night3);padding:6px 6px calc(6px + env(safe-area-inset-bottom));transition:transform 260ms var(--ease)}
.bbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;border-radius:14px;text-decoration:none;color:var(--on);font:600 13px/1 var(--lab);letter-spacing:.06em}
.bbar a svg{width:22px;height:22px}
.bbar a.hot{background:var(--tang);color:#fff}
@media (min-width:980px){.bbar{display:none}}

/* ambient */
.glint{opacity:0}
.mark .orb{transform-box:view-box;transform-origin:280px 82px}
@media (prefers-reduced-motion:no-preference){
  .glint.go{animation:glint 1.4s var(--ease) 1}
}
@keyframes glint{0%{opacity:0;transform:translateX(-30px)}30%{opacity:.9}100%{opacity:0;transform:translateX(30px)}}
</style>
