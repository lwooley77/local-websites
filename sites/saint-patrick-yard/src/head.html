<style>
%%FONTS%%
:root{
  --paper:#F4F0E6;--paper-2:#EBE5D6;--paper-3:#E0D8C4;

}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}

a{color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:700;line-height:1.02;letter-spacing:-.02em;margin:0}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.label{font:500 12.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.press{transition:transform .16s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:12px;font:600 17px/1.1 var(--body);text-decoration:none;border:2px solid transparent;white-space:nowrap}
.btn svg{width:20px;height:20px;flex:none}
.btn-est{background:var(--rust);color:#fff}
.btn-est:hover{background:var(--rust-d)}
.btn-line{border-color:var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--paper)}

/* preview bar */
.pv{background:var(--ink);color:#E9E4D6;font:500 12px/1.2 var(--mono);letter-spacing:.06em}

/* services */

/* how it works */
.how{background:var(--paper-2);position:relative}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}

}

/* about */
