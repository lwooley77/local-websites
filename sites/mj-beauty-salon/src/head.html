<style>
%%FONTS%%
:root{
  --bg:#F6EFE3;--surf:#EFE4D2;--surf2:#E4D3B8;--ink:#2A1E1A;--muted:#5A463D;--muted2:#6E5A4E;
  --cherry:#A8233A;--cherry2:#8E1C30;--mint:#8CC3B0;--mintdk:#2C6658;--cream:#F6EFE3;
  --line:rgba(42,30,26,.16);
  --disp:'Young Serif',Georgia,serif;--lab:'Josefin Sans',sans-serif;--body:'Karla',sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);--ease2:cubic-bezier(.77,0,.175,1);
  --wrap:1160px;--gut:20px;--pb:0px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--cherry);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.lab{font:600 13px/1.2 var(--lab);letter-spacing:.16em;text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.press{transition:transform .16s var(--ease),background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.press:active{transform:scale(.97)}

/* preview bar */
.pbar{background:var(--ink);color:#EADFCF;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 48px;height:38px;position:relative;font:600 11.5px/1 var(--lab);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.pbar b{color:#F2B9C2;font-weight:600}
.pbar span{overflow:hidden;text-overflow:ellipsis}
.pbar button{position:absolute;right:4px;top:0;width:44px;height:38px;display:grid;place-items:center;color:#EADFCF}
.pbar.gone{display:none}

/* nav */
.nav{position:sticky;top:0;z-index:40;background:rgba(246,239,227,.96);border-bottom:1px solid var(--line);transition:transform .28s var(--ease)}
.nav.hide{transform:translateY(-100%)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;min-height:44px}
.brand svg{width:40px;height:40px}
.brand b{font:400 21px/1 var(--disp)}
.brand small{display:block;font:600 10px/1 var(--lab);letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);margin-top:5px}
.links{display:flex;gap:4px}
.links a{font:600 13px/1 var(--lab);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;padding:15px 12px;border-radius:8px;color:var(--muted)}
.links a:hover{color:var(--cherry)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font:700 16px/1 var(--body);text-decoration:none;border:2px solid transparent;white-space:nowrap}
.btn-c{background:var(--cherry);color:#fff}
.btn-c:hover{background:var(--cherry2)}
.btn-o{border-color:var(--ink);color:var(--ink)}
.btn-o:hover{background:var(--ink);color:var(--cream)}
.nav .btn{min-height:46px;padding:0 18px;font-size:15px}
.mbtn{display:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);place-items:center}
.ncall{display:none}

/* phone menu */
.menu{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--cream);display:flex;flex-direction:column;padding:20px var(--gut) 28px;opacity:0;visibility:hidden;transition:opacity .24s var(--ease),visibility 0s .24s}
.menu.open{opacity:1;visibility:visible;transition:opacity .24s var(--ease)}
.menu .top{display:flex;justify-content:space-between;align-items:center;min-height:52px}
.menu .x{width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(246,239,227,.5);display:grid;place-items:center}
.menu nav{display:flex;flex-direction:column;margin-top:28px}
.menu nav a{font:400 34px/1.1 var(--disp);text-decoration:none;padding:12px 0;border-bottom:1px solid rgba(246,239,227,.14);display:flex;justify-content:space-between;align-items:center}
.menu nav a span{font:600 12px/1 var(--lab);letter-spacing:.16em;color:#CDBBA6}
.menu .foot{margin-top:auto;display:grid;gap:12px}
.menu .foot .btn{width:100%}
.menu .btn-o{border-color:var(--cream);color:var(--cream)}

/* hero */
.hero{position:relative;overflow:hidden;padding:56px 0 0}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero-kick{display:flex;align-items:center;gap:12px;color:var(--mintdk);margin-bottom:22px}
.hero-kick::before{content:"";width:34px;height:2px;background:currentColor}
.hero h1{font-size:clamp(56px,8.6vw,112px);line-height:.94;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--cherry);display:block}
.hero .lede{font-size:19px;color:var(--muted);max-width:30em;margin:26px 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero .rate{display:inline-flex;align-items:center;gap:10px;margin-top:26px;color:var(--muted);text-decoration:none;font-size:15.5px;min-height:44px}
.hero .rate b{color:var(--ink)}
.stars{color:var(--cherry);letter-spacing:2px;font-size:15px}
.hero-art{position:relative;aspect-ratio:430/444;max-width:520px;width:100%;justify-self:end;overflow:hidden}
.hero-art svg{width:100%;height:100%}
.hero-art svg.plane{width:40%;height:auto}
.floor{height:64px;margin-top:40px;background:
  conic-gradient(var(--ink) 25%,var(--bg) 0 50%,var(--ink) 0 75%,var(--bg) 0) 0 0/32px 32px;opacity:.9;border-top:6px solid var(--cherry)}
.plane{position:absolute;top:0;left:0;width:30%;opacity:0;pointer-events:none;transform:translateX(-110%)}
.plane.fly{animation:fly 14s linear 1 forwards}
@keyframes fly{0%{transform:translateX(-110%);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(340%);opacity:0}}
.spark{transform-box:fill-box;transform-origin:center;opacity:.25;animation:tw 7s ease-in-out infinite}
.spark.s2{animation-delay:2.3s}.spark.s3{animation-delay:4.6s}
@keyframes tw{0%,70%,100%{opacity:.2;transform:scale(.85)}80%{opacity:1;transform:scale(1)}}

/* strip */
.strip{background:var(--cherry);color:#FBEFE6;overflow:hidden;border-bottom:6px solid var(--ink)}
.strip-track{display:flex;width:max-content;animation:mq 46s linear infinite}
.strip:hover .strip-track{animation-play-state:paused}
.strip a{display:flex;align-items:center;gap:22px;padding:0 0 0 22px;min-height:58px;text-decoration:none;font:600 14px/1 var(--lab);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.strip a:hover{color:#fff;text-decoration:underline;text-underline-offset:5px}
.strip a svg{width:14px;height:14px;fill:#F2B9C2}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
section{position:relative}
.sec{padding:96px 0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 40px;margin-bottom:40px}
.head .lab{color:var(--mintdk);display:block;margin-bottom:14px}
.head h2{font-size:clamp(38px,5vw,60px)}
.head p{color:var(--muted);max-width:30em}

/* services */
.svc-grid{display:grid;grid-template-columns:1fr 320px;gap:40px;align-items:start}
.svc-grid>*,.hero .wrap>*,.ab-grid>*,.rev-grid>*,.faq-grid>*,.hl-grid>*,.ct-grid>*{min-width:0}
.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:0 20px 0 14px;border-radius:999px;border:1.5px solid var(--line);font:600 13px/1 var(--lab);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.panel{background:var(--surf);border-radius:22px;padding:8px 26px;border:1px solid var(--line)}
.panel[hidden]{display:none}
.panel.flash{animation:fl .9s var(--ease)}
@keyframes fl{0%{box-shadow:0 0 0 0 rgba(168,35,58,.0)}30%{box-shadow:0 0 0 6px rgba(168,35,58,.28)}100%{box-shadow:0 0 0 0 rgba(168,35,58,0)}}
.row{display:grid;grid-template-columns:1fr auto 30px;gap:6px 18px;align-items:center;padding:20px 0;border-bottom:1px dashed rgba(42,30,26,.22);text-decoration:none;min-height:64px}
.row:last-child{border-bottom:0}
.row h3{font-size:23px}
.row p{grid-column:1;color:var(--muted);font-size:15.5px;line-height:1.45}
.row .pr{grid-row:1/span 2;grid-column:2;font:600 12px/1.2 var(--lab);letter-spacing:.12em;text-transform:uppercase;color:var(--mintdk);text-align:right}
.row .go{grid-row:1/span 2;grid-column:3;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--cherry);transition:transform .2s var(--ease),background-color .2s var(--ease)}
.row .go svg{width:16px;height:16px}
.row:hover .go{background:var(--cherry);color:#fff;transform:translateX(3px)}
.row:hover h3{color:var(--cherry)}
.note{background:var(--ink);color:var(--cream);border-radius:22px;padding:30px 26px;position:sticky;top:96px;overflow:hidden}
.note h3{font-size:28px;margin:10px 0 12px}
.note p{color:#DCCDBB;font-size:16px}
.note .btn{width:100%;margin-top:22px}
.note .lab{color:var(--mint)}
.note svg.deco{position:absolute;right:-18px;top:-14px;width:120px;height:120px;opacity:.13;color:var(--cream)}
.note .btn,.note .lab,.note h3,.note p{position:relative}
.fine{margin-top:18px;color:var(--muted2);font-size:14.5px}

/* about */
.about{background:var(--surf);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.ab-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:center}
.ab-art .tagc{transform:rotate(4deg)}
.ab-art{position:relative;background:var(--bg);border-radius:200px 200px 24px 24px;border:1.5px solid var(--ink);padding:36px 30px 30px;aspect-ratio:4/5;max-width:420px;width:100%}
.ab-art svg{width:100%;height:100%}
.ab-art .tagc{position:absolute;right:-14px;bottom:-16px;background:var(--cherry);color:#fff;padding:12px 16px;border-radius:12px;transform:rotate(-4deg)}
.ab-art .tagc b{display:block;font:400 30px/1 var(--disp)}
.ab-art .tagc span{font:600 11px/1.2 var(--lab);letter-spacing:.14em;text-transform:uppercase}
.ab-txt .lab{color:var(--mintdk)}
.ab-txt h2{font-size:clamp(36px,4.6vw,56px);margin:14px 0 22px}
.ab-txt p{color:var(--muted);margin-bottom:16px;max-width:34em}
.ab-txt p.big{font-size:20px;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.facts div{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.facts svg{color:var(--cherry)}
.photo{margin:0;border-radius:18px;overflow:hidden;border:1.5px solid var(--ink)}
.photo img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}

/* reviews */
.rev{background:var(--ink);color:var(--cream);overflow:hidden}
.rev .head .lab{color:var(--mint)}
.rev .head p{color:#DCCDBB}
.rev-grid{display:grid;grid-template-columns:340px 1fr;gap:48px;align-items:start}
.score{border:1.5px solid rgba(246,239,227,.3);border-radius:22px;padding:30px 28px;text-decoration:none;display:block}
.score .num{font:400 96px/.9 var(--disp);color:#fff}
.score .stars{font-size:22px;color:#F2B9C2;margin:12px 0 6px}
.score p{color:#DCCDBB}
.score .lk{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-weight:700;color:#fff;min-height:44px;border-bottom:2px solid var(--cherry)}
.score:hover .lk{border-color:#F2B9C2}
.quotes{display:grid;gap:18px}
.q{position:relative;padding:26px 28px 24px 74px;border-radius:20px;background:#35271F;margin:0}
.q:nth-child(2){margin-left:48px;background:#3D2D24}
.q:nth-child(3){margin-left:20px}
.q::before{content:"\201C";position:absolute;left:22px;top:6px;font:400 70px/1 var(--disp);color:var(--cherry)}
.q blockquote{margin:0;font:400 clamp(22px,2.6vw,28px)/1.25 var(--disp);color:#fff}
.q figcaption{margin-top:12px;font:600 12px/1.3 var(--lab);letter-spacing:.14em;text-transform:uppercase;color:#CDBBA6}
.rev .fine{color:#BFAE9B}
.rev .fine a{color:#F2B9C2}

/* contact */
.ct-grid{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:auto auto;gap:16px}
.card{border-radius:22px;padding:28px;text-decoration:none;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--ink);min-height:150px;position:relative;overflow:hidden}
.card .lab{color:var(--muted2)}
.card b{font:400 30px/1.1 var(--disp)}
.card span.s{color:var(--muted);font-size:16px}
.card .ar{position:absolute;right:22px;top:24px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;transition:transform .2s var(--ease)}
.card:hover .ar{transform:translate(3px,-3px)}
.card.big{grid-row:1/span 2;background:var(--cherry);color:#fff;border-color:var(--cherry);justify-content:flex-end;min-height:330px}
.card.big .lab,.card.big span.s{color:#FBE1E5}
.card.big b{font-size:clamp(38px,5vw,58px)}
.card.big svg.deco{position:absolute;right:-24px;top:70px;width:240px;height:240px;opacity:.14;fill:none;stroke:#fff;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.card.mint{background:var(--mint);border-color:var(--mint)}
.card.mint .lab{color:#1F4A40}
.card.mint span.s{color:#1F3B35}

/* faq */
.faq{background:var(--surf);border-top:1px solid var(--line)}
.faq-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
.acc{border-top:1.5px solid var(--ink)}
.acc-i{border-bottom:1.5px solid var(--ink)}
.acc-b{width:100%;display:flex;justify-content:space-between;align-items:center;gap:18px;text-align:left;padding:22px 0;min-height:64px;font:400 22px/1.25 var(--disp)}
.acc-b .pm{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;transition:transform .25s var(--ease),background-color .2s var(--ease)}
.acc-b[aria-expanded="true"] .pm{transform:rotate(45deg);background:var(--ink);color:var(--cream)}
.acc-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease)}
.acc-p>div{overflow:hidden}
.acc-p p{padding:0 50px 24px 0;color:var(--muted)}
.acc-b[aria-expanded="true"]+.acc-p{grid-template-rows:1fr}
.acc-p a{color:var(--cherry);font-weight:700}

/* hours */
.hl-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
.hours{background:var(--bg);border:1.5px solid var(--ink);border-radius:22px;padding:24px 28px}
.hours ul{list-style:none;margin:0;padding:0}
.hours li{display:flex;justify-content:space-between;gap:16px;padding:13px 12px;border-bottom:1px dashed rgba(42,30,26,.22);font-size:17px}
.hours li:last-child{border-bottom:0}
.hours li span:last-child{color:var(--muted)}
.hours li.today{background:var(--ink);color:var(--cream);border-radius:12px;border-bottom-color:transparent;font-weight:700}
.hours li.today span:last-child{color:#F2B9C2}
.hours .fine{margin-top:14px}
.loc{background:var(--mintdk);color:#fff;border-radius:22px;padding:28px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.loc .lab{color:#CFEDE2}
.loc address{font:400 30px/1.15 var(--disp);font-style:normal;margin:12px 0 10px}
.loc p{color:#DDF1EA}
.loc .btn{margin-top:22px;align-self:flex-start;background:var(--cream);color:var(--ink)}
.loc .btn:hover{background:#fff}
.loc svg.hills{margin-top:auto;max-width:none;height:110px;width:calc(100% + 56px);margin-left:-28px;margin-bottom:-28px;padding-top:24px}

/* footer */
.foot-scene{background:var(--bg)}
.foot-scene svg{width:100%;height:auto;min-height:150px}
footer{background:var(--ink);color:#DCCDBB;padding:40px 0 120px;font-size:15.5px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px 40px}
footer b{font:400 26px/1 var(--disp);color:#fff;display:block;margin-bottom:10px}
footer a{color:#fff;text-decoration:none;display:inline-flex;min-height:44px;align-items:center}
footer a:hover{text-decoration:underline}
footer .sm{font-size:13.5px;color:#B5A390;max-width:30em}

/* bottom bar */
.bbar{display:none}

/* photo slots */
[data-slot][hidden]{display:none!important}

@media (max-width:980px){
  .links{display:none}
  .mbtn{display:grid}
  .nav .btn.dcall{display:none}
  .ncall{display:grid;width:46px;height:46px;border-radius:50%;background:var(--cherry);color:#fff;place-items:center}
  .hero .wrap,.svc-grid,.ab-grid,.rev-grid,.faq-grid,.hl-grid{grid-template-columns:1fr}
  .hero-art{justify-self:center;max-width:420px}
  .note{position:relative;top:0}
  .ab-art{margin:0 auto}
  .ab-grid{gap:44px}
}
@media (max-width:640px){
  :root{--gut:18px}
  body{font-size:17px}
  .pbar{font-size:10px;letter-spacing:.08em;padding:0 44px 0 12px;justify-content:flex-start}
  .nav .wrap{height:62px;gap:10px}
  .brand b{font-size:19px}
  .brand small{display:none}
  .brand svg{width:36px;height:36px}
  .hero{padding-top:34px}
  .hero .wrap{gap:10px}
  .hero h1{font-size:clamp(52px,16vw,66px)}
  .hero .lede{font-size:18px;margin:20px 0 24px}
  .cta .btn{flex:1 1 100%}
  .hero-art{max-width:330px;margin-top:6px}
  .floor{height:44px;margin-top:10px;background-size:22px 22px}
  .sec{padding:68px 0}
  .head{margin-bottom:28px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1*var(--gut)) 18px;padding:2px var(--gut);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:0 16px 0 10px}
  .panel{padding:4px 18px;border-radius:18px}
  .row{grid-template-columns:1fr 30px;gap:4px 12px;padding:18px 0}
  .row h3{font-size:21px}
  .row .pr{grid-row:auto;grid-column:1;text-align:left;margin-top:4px}
  .row .go{grid-row:1/span 3;grid-column:2}
  .ab-art{max-width:300px;padding:28px 22px 22px}
  .ab-art .tagc{right:-8px;bottom:-14px;padding:10px 14px}
  .ab-art .tagc b{font-size:26px}
  .faq-grid{gap:0}
