<style>
%%FONTS%%
:root{
  --paper:#F3ECDF;--paper-2:#E9E0CF;--paper-3:#DDD2BC;

  --display:'Anton',Impact,sans-serif;--serif:'DM Serif Display',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--body:'Karla',Arial,sans-serif;
  --gut:20px;--max:1180px;--navh:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}

:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:4px}

.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.lbl{font:500 12.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font:700 16.5px/1 var(--body);text-decoration:none;border:2px solid var(--ink);white-space:nowrap}

.btn-line{background:transparent;color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--paper)}
.dark .btn-line{border-color:var(--cream);color:var(--cream)}
.dark .btn-line:hover{background:var(--cream);color:var(--felt)}

/* preview bar */
.pbar{background:var(--felt);color:var(--cream-2);font:500 13.5px/1 var(--body);letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 44px 0 12px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* nav */

.deck .back{transform:translate(-14%,4%) rotate(-11deg);background:var(--felt)}

.strip{background:var(--felt);color:var(--cream);overflow:hidden;border-block:1px solid #000;position:relative}

.about .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:start}

.quote cite{font:500 12.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;font-style:normal;color:var(--ink-3)}

.court{background:var(--felt);color:var(--cream);border-radius:20px;padding:12px;position:relative}

.court dl{margin:0;display:grid;gap:0}

.court .ball{position:absolute;right:-40px;top:-40px;width:170px;height:170px;opacity:.16;color:var(--brass)}

.hours-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}

.hnote{margin:16px 0 0;font-size:15px;color:var(--cream-2)}
.addr{font:400 clamp(34px,4vw,46px)/1.02 var(--display);text-transform:uppercase;margin:0 0 6px;color:var(--cream)}

.scene{display:block;width:100%;height:auto;min-height:170px;max-height:340px;object-fit:cover}

/* bottom bar + sheet */

.sheet-bg{position:fixed;inset:0;background:rgba(10,9,7,.55);z-index:90;opacity:0;visibility:hidden;transition:opacity .22s var(--ease),visibility 0s .22s}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--paper);border-radius:22px 22px 0 0;padding:10px var(--gut) calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s var(--ease);max-width:560px;margin:0 auto;visibility:hidden}
.sheet.on{transform:translateY(0);visibility:visible}
.sheet.drag{transition:none}
.grab{width:100%;height:30px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:44px;height:5px;border-radius:3px;background:var(--paper-3)}
.sheet h3{font:400 34px/1 var(--display);text-transform:uppercase;margin:4px 0 6px}
.sheet p{margin:0 0 18px;color:var(--ink-2);font-size:16px}
.sheet .opts{display:grid;gap:10px}
.sheet .btn{width:100%;justify-content:space-between;padding:0 22px}
