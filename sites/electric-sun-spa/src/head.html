<style>
%%FONTS%%
:root{
  --cream:#FFF6E6;--sand:#FCEBCB;--butter:#F9DD9C;
  --ink:#2A1A10;--ink-2:#5A4232;--ink-3:#6F5442;
  --sun:#FFC21A;--sun-2:#FFD65C;--ember:#B93A0B;--coral:#EE6A3D;
  --dusk:#2A1A10;--dusk-2:#3A2518;--line:rgba(42,26,16,.14);
  --ease:cubic-bezier(.23,1,.32,1);--ease2:cubic-bezier(.77,0,.175,1);
  --display:'Young Serif',Georgia,serif;--label:'Josefin Sans',sans-serif;--body:'Figtree',sans-serif;
  --r:18px;--wrap:1160px;--gut:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--cream);color:var(--ink);font:400 17px/1.6 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.label{font:600 13px/1.2 var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;letter-spacing:-.01em}
h2{font-size:clamp(34px,6vw,58px)}
h3{font-size:24px}
.press{transition:transform .16s var(--ease),background-color .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.press:active{transform:scale(.97)}
[data-k]:not([src]){display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font:600 17px/1 var(--body);text-decoration:none;white-space:nowrap}
.btn svg{width:20px;height:20px;flex:none}
.btn-sun{background:var(--sun);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn-sun:hover{background:var(--sun-2)}
.btn-ink{background:var(--ink);color:var(--cream)}
.btn-ink:hover{background:#45291a}
.btn-line{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--sand)}

/* preview bar */
.pv{background:var(--ink);color:var(--cream);font:500 14px/1.3 var(--body);position:relative;z-index:60}
.pv .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.pv p{white-space:nowrap}
.pv-short{display:none}

.pv button{width:44px;height:40px;display:grid;place-items:center;margin-right:-12px;color:var(--cream)}

/* nav */

.badge.open i{background:#1F8A4C;box-shadow:0 0 0 4px rgba(31,138,76,.16)}
.nav .btn{min-height:44px;padding:0 18px;font-size:15px}

.menu-top .brand span{color:var(--cream)}
.menu-close{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--cream);color:var(--cream)}
.menu-close svg{width:20px;height:20px}
.menu nav{display:flex;flex-direction:column;margin:28px 0 auto}
.menu nav a{font:400 40px/1.15 var(--display);text-decoration:none;padding:10px 0;border-bottom:1px solid rgba(255,246,230,.12)}
.menu .badge{color:#EBDAC4;margin:18px 0}
.menu .mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu .btn-line{box-shadow:inset 0 0 0 2px var(--cream);color:var(--cream)}

.hero{position:relative;overflow:hidden;padding:56px 0 40px}

/* services */

.nav-shown .tabs-wrap{top:68px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 15px 0 12px;border-radius:999px;font:600 13.5px/1 var(--label);letter-spacing:.08em;text-transform:uppercase;box-shadow:inset 0 0 0 1.5px rgba(42,26,16,.28);color:var(--ink)}

.party a{font-weight:600}

/* reviews */
.reviews{background:var(--dusk);color:var(--cream);overflow:hidden}
.reviews .label{color:var(--sun)}
.reviews .sec-head p{color:#E7D5BF}
.scores{display:flex;flex-wrap:wrap;gap:14px}
.score{display:flex;align-items:center;gap:16px;padding:16px 22px 16px 18px;border-radius:var(--r);background:var(--dusk-2);text-decoration:none;min-height:64px}
.score:hover{background:#4a3020}
.score b{font:400 44px/1 var(--display);color:var(--sun)}
.score span{font-size:14px;line-height:1.35;color:#E7D5BF}
.score span strong{display:block;color:var(--cream);font-weight:600;font-size:15px}
.score .stars{display:flex;gap:2px;color:var(--sun);margin-bottom:3px}
.stars svg{width:14px;height:14px}
.quotes{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:10px}
.q{background:var(--cream);color:var(--ink);border-radius:var(--r);padding:28px 28px 24px;position:relative;display:flex;flex-direction:column}
.q:nth-child(1){grid-column:1/8}
.q:nth-child(2){grid-column:8/13;background:var(--sun)}
.q:nth-child(3){grid-column:1/6;background:var(--butter)}
.q:nth-child(4){grid-column:6/13}
.q blockquote{font:400 21px/1.42 var(--display);margin-bottom:18px;flex:1}

.contact .grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px}

.card svg.ic{width:34px;height:34px}

.card.text .k,.card.text svg.ic{color:var(--sun)}

.card.dir{background:var(--sand)}
.card.dir .k,.card.dir svg.ic{color:var(--ember)}
.card.dir small,.card.call small{color:var(--ink-2)}

.card.book{grid-column:1/-1;flex-direction:row;align-items:center;min-height:auto;background:transparent;box-shadow:inset 0 0 0 2px var(--ink);padding:22px 28px}
.card.book .v{font-size:clamp(24px,2.6vw,32px)}

/* faq */
.faq .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}.faq .wrap>div:first-child{position:sticky;top:110px}
.faq-list{border-top:2px solid var(--ink)}
.faq-item{border-bottom:1px solid var(--line)}
.faq-item button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:18px;text-align:left;padding:22px 2px;font:600 18px/1.35 var(--body);min-height:64px}
.faq-item button svg{width:22px;height:22px;flex:none;color:var(--ember);transition:transform .26s var(--ease)}

.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease)}
.faq-a>div{overflow:hidden}
.faq-a p{padding:0 2px 22px;color:var(--ink-2);max-width:40em}
.faq-item.on .faq-a{grid-template-rows:1fr}

/* hours */
#visit{background:var(--sand)}
#visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.arc{width:100%;max-width:520px;margin:6px 0 10px}
.arc-cap{font:500 16px/1.4 var(--body);color:var(--ink-2);margin-bottom:22px}

.hours td{text-align:right;font-variant-numeric:tabular-nums}
.hours tr.today{background:var(--ink);color:var(--cream)}
.hours tr.today th{font-weight:600}
.hours tr.today th::after{content:"Today";margin-left:10px;font:600 11px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--sun);padding:5px 8px 3px;border-radius:999px;vertical-align:2px}
.hours-note{font-size:15px;color:var(--ink-3);margin-top:14px}
.loc h3{font-size:34px;margin:12px 0 8px}

.loc .sub{color:var(--ink-2);margin-bottom:24px}

.loc .cta .btn{flex:1 1 auto}
.loc-card{background:var(--cream);border-radius:var(--r);padding:30px;box-shadow:inset 0 0 0 2px var(--ink)}
.know{list-style:none;margin:26px 0 0;border-top:1px solid var(--line)}
.know li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;color:var(--ink-2)}
.know li b{color:var(--ink);font-weight:600}
.know svg{width:20px;height:20px;flex:none;color:var(--ember);margin-top:3px}

/* footer */
footer{background:var(--dusk);color:#E7D5BF;position:relative}
.scene{display:block;width:100%;height:auto;background:var(--cream)}
.foot{padding:44px 0 56px}
.foot .wrap{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:36px}
.foot .brand span{color:var(--cream)}
.foot p{font-size:15px;margin-top:14px;max-width:26em}
.foot h4{font:600 13px/1 var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--sun);margin-bottom:14px}
.foot ul{list-style:none}
.foot li a{display:inline-block;padding:8px 0;text-decoration:none;color:var(--cream)}
.foot li a:hover{color:var(--sun)}
.foot .fine{grid-column:1/-1;border-top:1px solid rgba(255,246,230,.14);padding-top:22px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* bottom bar */
.bar{display:none}

/* photos: panel photos, gallery, lightbox */
.panel-head{display:grid;grid-template-columns:1fr;gap:18px;margin-bottom:22px}
.panel-head.has-photo{grid-template-columns:1fr minmax(240px,330px);gap:32px;align-items:center}
