<style>
%%FONTS%%
:root{
  --ink:#26141a;--ink-2:#3a1d26;--cream:#fbf4ee;--paper:#fffaf6;--blush:#f2d9d2;--blush-2:#ecc9c1;
  --lacquer:#a3122f;--lacquer-d:#7d0d24;--rose:#d97f8a;--gold:#b8894a;--muted:#6a5257;--line:#e6d3cb;
  --e1:cubic-bezier(.23,1,.32,1);--e2:cubic-bezier(.77,0,.175,1);
  --disp:'DM Serif Display',Georgia,serif;--lab:'Outfit',Arial,sans-serif;--body:'Figtree',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--ink);font:17px/1.6 var(--body);overflow-x:hidden}

svg{display:block}

:focus-visible{outline:3px solid var(--lacquer);outline-offset:3px;border-radius:6px}
.dark :focus-visible,footer :focus-visible,.bar :focus-visible,#menu :focus-visible{outline-color:var(--blush)}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.lab{font:600 13px/1.2 var(--lab);letter-spacing:.16em;text-transform:uppercase}
h2{font:400 clamp(38px,6vw,60px)/1.02 var(--disp);letter-spacing:-.01em}
.sec{padding:88px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font:600 16px/1 var(--lab);letter-spacing:.02em;text-decoration:none;border:2px solid transparent;transition:transform .16s var(--e1),background-color .2s var(--e1),color .2s var(--e1)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex:none;fill:currentColor}
.b-red{background:var(--lacquer);color:#fff}
.b-red:hover{background:var(--lacquer-d)}
.b-line{border-color:var(--ink);color:var(--ink)}
.b-line:hover{background:var(--ink);color:var(--cream)}

/* preview bar */
#pbar{background:var(--ink);color:var(--blush);font:500 13px/1.3 var(--lab);letter-spacing:.06em}
#pbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
#pbar b{color:#fff;font-weight:600}
#pbar.gone{display:none}
#pbarX{width:44px;height:40px;background:none;border:0;color:var(--blush);cursor:pointer;display:grid;place-items:center;margin-right:-12px}
.pb-s{display:none}
@media(max-width:560px){.pb-l{display:none}.pb-s{display:inline}}

/* nav */
#nav{position:sticky;top:0;z-index:40;background:rgba(251,244,238,.96);border-bottom:1px solid var(--line)}
#nav .wrap{display:flex;align-items:center;gap:18px;min-height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}

.links{display:flex;gap:4px;margin-left:auto}

.open{display:inline-flex;align-items:center;gap:7px;font:500 13px/1.2 var(--lab);color:var(--muted);white-space:nowrap}

#menu{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--cream);display:flex;flex-direction:column;padding:16px 20px 28px;visibility:hidden;opacity:0;transform:translateY(-8px);transition:opacity .22s var(--e1),transform .22s var(--e1),visibility 0s .22s}

/* hero */

.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center}

.hero h1 em{font-style:normal;color:var(--lacquer)}

.stars{display:inline-flex;vertical-align:-2px;margin-right:6px}
.art{position:relative;max-width:500px;justify-self:end;width:100%}
.art svg{width:100%;height:auto}

.sheen{animation:sheen 7s var(--e2) infinite 1.5s}

.strip{background:var(--ink);color:var(--cream);overflow:hidden;border-top:6px solid var(--lacquer)}

.svc-head p{max-width:42ch;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font:600 15px/1 var(--lab);letter-spacing:.03em;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:9px;transition:background-color .2s var(--e1),border-color .2s var(--e1),transform .16s var(--e1)}

.panel{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:10px 28px}
.panel.flash{animation:flash .28s var(--e1)}

.row{display:flex;align-items:center;gap:16px;min-height:76px;padding:14px 0;border-bottom:1px dashed var(--line);text-decoration:none}
.row:nth-last-child(-n+2){border-bottom:0}
.row svg.tip{width:18px;height:28px;flex:none}
.row b{display:block;font:400 24px/1.15 var(--disp)}

.row .pr{margin-left:auto;font:600 13px/1.2 var(--lab);letter-spacing:.1em;text-transform:uppercase;color:var(--lacquer);white-space:nowrap;text-align:right}
.row:hover b{color:var(--lacquer)}
.svc-note{margin-top:18px;font-size:15px;color:var(--muted)}
@media(max-width:760px){.panel{grid-template-columns:1fr;padding:4px 18px}.row:nth-last-child(2){border-bottom:1px dashed var(--line)}.row b{font-size:22px}.tabs{gap:6px}.tab{padding:0 15px;font-size:14px}}

/* about */
.about{background:var(--blush)}
.about .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.about p{font-size:18px;margin-top:18px;max-width:52ch}
.about .lab{color:var(--lacquer-d)}
.chart{background:var(--paper);border-radius:24px;padding:26px;box-shadow:0 1px 0 var(--blush-2),0 20px 40px -24px rgba(38,20,26,.35)}

/* reviews */
.rev .wrap{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center}

@media(max-width:700px){.rev .wrap{grid-template-columns:1fr;gap:18px}}

/* contact */
.contact{background:var(--ink);color:var(--cream)}
.contact h2{color:#fff}
.contact .sub{color:var(--blush);margin:10px 0 34px;max-width:46ch}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{display:flex;flex-direction:column;gap:6px;min-height:170px;padding:24px;border-radius:22px;text-decoration:none;background:var(--ink-2);border:1px solid rgba(242,217,210,.16);transition:transform .16s var(--e1),background-color .2s var(--e1)}
.card:active{transform:scale(.97)}
.card:hover{background:#4a2532}
.card.c1{background:var(--lacquer);border-color:var(--lacquer)}
.card.c1:hover{background:var(--lacquer-d)}

.card .lab{color:var(--blush);margin-top:18px}

.card b{font:400 28px/1.1 var(--disp);color:#fff}
@media(max-width:760px){.cards{grid-template-columns:1fr}.card{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 16px}.card svg{margin:0}.card .lab{margin:0;flex-basis:calc(100% - 44px)}.card b{flex-basis:100%;font-size:26px}}

/* faq */
.faq .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:48px}
.acc{border-top:1px solid var(--line)}
.acc-b{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:72px;padding:16px 0;background:none;border:0;border-bottom:1px solid var(--line);font:400 23px/1.25 var(--disp);color:var(--ink);text-align:left;cursor:pointer}
.acc-b svg{width:22px;height:22px;flex:none;transition:transform .22s var(--e1);color:var(--lacquer)}
.acc-b[aria-expanded="true"] svg{transform:rotate(45deg)}
.acc-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--e1)}
.acc-b[aria-expanded="true"]+.acc-p{grid-template-rows:1fr}
.acc-p>div{overflow:hidden}
.acc-p p{padding:14px 0 22px;color:var(--ink-2);max-width:60ch}

/* hours */
.hours{background:var(--paper);border-top:1px solid var(--line)}
.hours .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.htab{margin-top:24px;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.htab div{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 20px;border-bottom:1px solid var(--line);font:500 16px/1 var(--lab)}
.htab div:last-child{border-bottom:0}
.htab div span:first-child{display:flex;align-items:center;gap:12px}
.htab div i{width:10px;height:14px;border-radius:5px 5px 2px 2px;background:var(--blush-2)}
.htab .today{background:var(--ink);color:#fff}
.htab .today i{background:var(--lacquer);box-shadow:0 0 0 2px var(--cream)}
.htab .today span:first-child::after{content:"Today";font:600 11px/1 var(--lab);letter-spacing:.12em;text-transform:uppercase;background:var(--lacquer);padding:5px 8px;border-radius:5px}
.hnote{font-size:15px;color:var(--muted);margin-top:12px}
.addr{font:400 34px/1.15 var(--disp);margin:20px 0 22px}
.loc .btns{display:flex;flex-wrap:wrap;gap:12px}
.map{margin-top:28px}
.map svg{width:100%;height:auto;border-radius:20px}
@media(max-width:820px){.hours .wrap{grid-template-columns:1fr;gap:40px}.addr{font-size:30px}}

/* footer */
footer{background:var(--ink);color:var(--blush);position:relative}
.shelf{width:100%;height:120px;color:var(--ink)}
footer .wrap{padding-top:30px;padding-bottom:110px}
.fgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:32px}
.fname{font:400 46px/1 var(--disp);color:#fff}
footer h3{font:600 13px/1.2 var(--lab);letter-spacing:.16em;text-transform:uppercase;color:var(--rose);margin-bottom:12px}
footer ul{list-style:none}
footer li a,footer p a{display:inline-block;padding:6px 0;text-decoration:none;color:var(--blush)}
footer li a:hover{color:#fff}
#privacy{margin-top:34px;padding:20px 22px;border-radius:16px;background:var(--ink-2);font-size:15px;color:var(--blush);max-width:760px}
#privacy b{color:#fff}
.legal{margin-top:24px;font-size:14px;color:#c8aeb0;display:flex;flex-wrap:wrap;gap:6px 18px}
.legal a{color:#fff;padding:10px 0}
@media(max-width:760px){.fgrid{grid-template-columns:1fr}.shelf{height:90px}}
@media(min-width:761px){footer .wrap{padding-bottom:44px}}

/* phone bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:none;grid-template-columns:repeat(4,1fr);background:var(--ink);border-top:3px solid var(--lacquer);padding-bottom:env(safe-area-inset-bottom)}
.bar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:62px;text-decoration:none;color:var(--cream);font:600 12.5px/1 var(--lab);letter-spacing:.05em}
.bar a:first-child{background:var(--lacquer);color:#fff}
.bar svg{width:20px;height:20px}
@media(max-width:760px){.bar{display:grid}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  #strip{flex-wrap:wrap;width:auto}
}
</style>
