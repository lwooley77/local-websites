<script type="application/ld+json">{"@context":"https://schema.org","@type":"ProfessionalService","name":"%%NAME%%","description":"Custom website design for local businesses in Northern Nevada.","email":"%%EMAIL%%","areaServed":"Northern Nevada"}</script>
<style>
%%FONTS%%
:root{--bg:#15120e;--bg2:#1f1a14;--paper:#f4eee3;--ink:#1e1b16;--muted:#cfc5b2;--line:#3a3227;--gold:#e6b26a;--ember:#e0793c;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--paper);font:400 17px/1.65 'Work Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.05;letter-spacing:-.012em}
.k{font:600 12px/1 'Work Sans',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}

.top{position:sticky;top:0;z-index:30;background:rgba(21,18,14,.94);border-bottom:1px solid var(--line);transition:transform .25s var(--ease)}
.top.hide{transform:translateY(-100%)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:600 20px/1 Fraunces,Georgia,serif}
.logo svg{width:28px;height:28px;flex:none}
.nav{display:none;gap:26px}
.nav a{text-decoration:none;font-weight:500;font-size:15px;padding:10px 2px;color:var(--muted)}
.nav a:hover{color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;background:var(--gold);color:var(--ink);font:600 16px/1 'Work Sans',sans-serif;text-decoration:none;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.alt{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}
.btn.alt:hover{box-shadow:inset 0 0 0 2px var(--gold)}

/* hero */
.hero{padding:48px 0 24px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-120px;top:-80px;width:620px;height:620px;border-radius:50%;background:radial-gradient(closest-side,rgba(224,121,60,.28),transparent)}
.hero .wrap{display:grid;gap:40px;position:relative}
.hero h1{font-size:clamp(40px,8vw,76px);margin:18px 0 20px;max-width:13ch}
.hero h1 em{font-style:normal;color:var(--gold)}
.lead{font-size:clamp(18px,2.4vw,21px);color:var(--muted);max-width:44ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.trust{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--muted)}
.trust span::before{content:"";display:inline-block;width:8px;height:8px;background:var(--gold);border-radius:50%;margin-right:8px}
.fan{position:relative;height:520px;max-width:520px;margin:0 auto;width:100%}
.fan .ph{position:absolute;top:0}
.fan .ph:nth-child(1){left:2%;transform:rotate(-7deg) translateY(var(--p1,0));z-index:1}
.fan .ph:nth-child(2){left:30%;transform:translateY(calc(var(--p2,0) + 22px));z-index:3}
.fan .ph:nth-child(3){left:58%;transform:rotate(7deg) translateY(var(--p1,0));z-index:2}

/* phone frame */
.ph{width:220px;border-radius:34px;padding:9px;background:#0b0907;box-shadow:0 0 0 2px #3b3226,0 24px 50px rgba(0,0,0,.55);flex:none}

.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
@media (max-width:480px){.fan .ph{width:160px;border-radius:28px;padding:7px}.fan .ph .scr{border-radius:21px}.fan{height:400px}}

.awning{width:100%;max-width:520px;height:auto;display:block;margin:0 auto;position:relative;z-index:1}
/* hero background: a map of local places getting found */
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(230,178,106,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(230,178,106,.09) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 80% 90% at 75% 40%,#000 15%,transparent 75%);mask-image:radial-gradient(ellipse 80% 90% at 75% 40%,#000 15%,transparent 75%)}
.pin{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px rgba(230,178,106,.8)}
.pin::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--gold);animation:ping 3.6s cubic-bezier(.23,1,.32,1) infinite;animation-delay:var(--d,0s)}
@keyframes ping{0%{transform:scale(1);opacity:.9}70%,100%{transform:scale(4.2);opacity:0}}
.hero .wrap>*{position:relative;z-index:1}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#15120e;display:grid;place-items:center;transition:opacity .35s cubic-bezier(.23,1,.32,1)}
#intro.out{opacity:0;pointer-events:none}
#intro .scene{width:min(78vw,360px)}
#intro .aw{transform-origin:top;animation:drop .7s cubic-bezier(.23,1,.32,1) both}
@keyframes drop{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#intro .sign{display:block;margin:22px auto 0;font:600 34px/1 'Work Sans',sans-serif;letter-spacing:.3em;text-align:center;color:#e6b26a;text-shadow:0 0 6px #e6b26a,0 0 22px rgba(230,178,106,.8);padding-left:.3em;opacity:0;animation:neon 1s .55s steps(1,end) forwards}
@keyframes neon{0%{opacity:0}12%{opacity:1}22%{opacity:.15}34%{opacity:1}46%{opacity:.35}60%,100%{opacity:1}}
#intro .nm{margin-top:18px;text-align:center;font:600 22px/1 Fraunces,Georgia,serif;color:#f4eee3;opacity:0;animation:rise .5s 1.2s cubic-bezier(.23,1,.32,1) forwards}

#intro .skip{position:absolute;right:16px;bottom:16px;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 2px #3a3227;color:#cfc5b2;font:600 14px 'Work Sans',sans-serif;cursor:pointer}
#intro .skip:focus-visible{outline:3px solid #e6b26a;outline-offset:3px}
@media (prefers-reduced-motion:reduce){#intro{display:none}.pin::after{animation:none;opacity:.4;transform:scale(2.2)}}
.why{margin:34px 0 0;max-width:860px}

.why>div:last-child{border-bottom:1px solid var(--line)}

.why dd{margin:0;color:var(--muted);max-width:62ch}
/* browser-window screenshots */
.shots{display:grid;gap:28px;margin-top:34px}
@media (min-width:860px){.shots{grid-template-columns:1.4fr 1fr;grid-template-rows:auto auto}.shots .big{grid-row:1 / span 2}}
.shot{display:block;text-decoration:none;color:inherit}
.win{border-radius:12px;overflow:hidden;background:#0b0907;box-shadow:0 0 0 2px #3b3226,0 22px 44px rgba(0,0,0,.5);transition:transform .25s var(--ease)}

.wbar{display:flex;gap:6px;padding:10px 12px;background:#2a231b}

.shot .cap{margin-top:14px;text-align:left;max-width:none}

/* (unused phone/builder styles removed below) */
.legacy-hide{display:none}
/* live builder (no longer used) */
.try{display:grid;gap:40px;margin-top:34px;align-items:center}

.ctl label,.ctl legend{display:block;font:600 13px/1 'Work Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;padding:0}
.ctl fieldset{border:0;padding:0;margin:0 0 26px}
.ctl input[type=text]{width:100%;min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);color:var(--paper);font:600 22px/1 Fraunces,Georgia,serif;padding:0 18px}
.ctl input[type=text]::placeholder{color:#8f8573}
.ctl input[type=text]:focus-visible{outline:3px solid var(--gold);border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{margin:0;display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);font:600 15px/1 'Work Sans',sans-serif;letter-spacing:0;text-transform:none;color:var(--paper);cursor:pointer;transition:transform .15s var(--ease)}
.chips label:active{transform:scale(.97)}

.chips input:focus-visible+label{outline:3px solid var(--paper);outline-offset:3px}
.sw{display:flex;gap:12px}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw label{margin:0;width:48px;height:48px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 2px var(--line);display:block;transition:transform .15s var(--ease)}

.tiny{color:var(--muted);font-size:14px;margin-top:6px}
.stage{display:grid;place-items:center}
.ph.big{width:280px}
.ph.big .scr{aspect-ratio:9/17;background:var(--pbg,#f4eee3);color:var(--pink,#1e1b16);position:relative;container-type:inline-size}
.sim{display:flex;flex-direction:column;height:100%;padding:16px 16px 0;font-family:'Work Sans',sans-serif}
.sim .bar{display:flex;align-items:center;justify-content:space-between;font:600 11px/1 'Work Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;opacity:.85}

.sim .b1,.sim .b2{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:999px;margin-top:12px;font:600 14px/1 'Work Sans',sans-serif}

.sim .dock{margin:auto -16px 0;display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,currentColor 92%,transparent);color:var(--pbg,#f4eee3);text-align:center;font:600 10px/1 'Work Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase}

.cap{margin-top:14px;font-size:13px;color:var(--muted);text-align:center;max-width:280px}
section{padding:76px 0;border-top:1px solid var(--line)}
.dockbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(21,18,14,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none}

.intro{color:var(--muted);max-width:56ch}

/* findings */
.find{list-style:none;padding:0;margin:34px 0 0}
.find li{display:grid;grid-template-columns:56px 1fr;gap:4px 18px;padding:22px 0;border-top:1px solid var(--line)}

/* work row */
.row{display:flex;gap:26px;overflow-x:auto;scroll-snap-type:x mandatory;padding:34px 20px 24px;margin:0 -20px;-webkit-overflow-scrolling:touch}
.row figure{scroll-snap-align:start;flex:none;width:236px}
.row figcaption{margin-top:16px;max-width:236px}

.row figcaption span{color:var(--muted);font-size:15px}
.row figure a{text-decoration:none;display:block}
.row .ph{width:236px;transition:transform .25s var(--ease)}

.hint{color:var(--muted);font-size:14px}
.note{color:var(--muted);font-size:14px;margin-top:6px;max-width:64ch}

/* steps / features */
.steps{list-style:none;padding:0;margin:34px 0 0}
.steps li{display:grid;grid-template-columns:64px 1fr;gap:4px 18px;padding:24px 0;border-top:1px solid var(--line)}

@media (min-width:760px){.get{grid-template-columns:1fr 1fr}}
.get li{padding:14px 0 14px 34px;border-top:1px solid var(--line);position:relative}
.get li::before{content:"";position:absolute;left:4px;top:22px;width:14px;height:8px;border-left:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:rotate(-45deg)}
.price p{max-width:58ch;color:var(--muted)}
.price p+p{margin-top:12px}

.faq{margin-top:28px;max-width:760px}
.faq h3{font:600 17px/1.3 'Work Sans',sans-serif;letter-spacing:0}
.faq button{width:100%;min-height:58px;display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;font:600 17px/1.3 'Work Sans',sans-serif;color:var(--paper);cursor:pointer}

.contact{background:var(--paper);color:var(--ink);border-top:0}

.contact .btn{background:var(--ink);color:var(--paper)}
footer{padding:26px 0 8px;font-size:14px;color:var(--muted)}
footer .r{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
